<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prima guerra mondiale 1914–1918 · Mappa interattiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ece0; --ink:#2a2420; --muted:#6b6258; --line:#d8cfbf; --card:#fffdf8;
  --E:#1d4f9a; --C:#b5361b; --sea:#cfe1ea;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:#efe7d8}
header h1{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.1}
header h1 span{font-weight:400;color:var(--muted)}
header .sp{flex:1}
button{font:inherit;cursor:pointer}
.hbtn{border:1px solid #c9bfae;background:#fffaf0;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--ink)}
.hbtn:hover{background:#fff}
.hbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* Disposizione: mappa → linea del tempo → scheda dell'evento al centro */
main{display:flex;flex-direction:column}
main.nopanel #panel{display:none}
#mapwrap{position:relative;height:60vh;height:60dvh;min-height:340px;overflow:hidden;background:var(--sea);border-bottom:1px solid var(--line)}
#map{display:block;width:100%;height:100%;touch-action:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);background:var(--sea)}
#datebadge{position:absolute;left:14px;top:12px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:10px;padding:6px 12px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#datebadge .y{font-family:Oswald,sans-serif;font-size:30px;font-weight:600;line-height:1}
#datebadge .l{font-size:13px;color:var(--muted)}
#legendBox{position:absolute;left:14px;bottom:14px;background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;max-height:calc(100% - 110px);overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:270px}
#legendBox[hidden]{display:none}
#legendBox h3{margin:0 0 6px;font-family:Oswald,sans-serif;font-weight:500;font-size:15px}
.lg{display:flex;align-items:center;gap:8px;margin:2px 0;line-height:1.2}
.lg svg{flex:none}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:38px;height:38px;border-radius:8px;border:1px solid #c9bfae;background:#fffaf0;font-size:20px;line-height:1}
#panel{background:var(--card);padding:18px 24px 28px;width:min(900px,100%);margin:16px auto 28px;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:999px;padding:3px 10px}
.count{float:right;font-size:13px;color:var(--muted);margin-top:3px}
.when{font-family:Oswald,sans-serif;font-size:17px;color:var(--muted);margin:12px 0 2px}
#panel h2{font-family:Oswald,sans-serif;font-weight:600;font-size:27px;line-height:1.12;margin:0 0 12px}
#panel p.txt{font-size:17px;line-height:1.55;margin:0 0 14px}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:16px;line-height:1.45}
.box b{display:block;font-family:Oswald,sans-serif;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.box.r{background:#fbf1d9;border-left:5px solid #d9a521}
.box.q{background:#e8f0f6;border-left:5px solid #2b7bb0}
.navbtns{display:flex;gap:8px;margin-top:16px}
.navbtns button{flex:1;padding:10px;border-radius:10px;border:1px solid #c9bfae;background:#fffaf0;font-size:16px;font-weight:700}
.navbtns button:hover{background:#fff}
footer{border-bottom:1px solid var(--line);background:#efe7d8;padding:8px 18px 10px;position:sticky;top:0;z-index:5}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #c9bfae;background:#fffaf0;border-radius:999px;padding:4px 11px;font-size:13px;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctl{display:flex;gap:6px;margin-left:auto}
.ctl button{border:1px solid #c9bfae;background:#fffaf0;border-radius:8px;padding:6px 12px;font-size:15px;font-weight:700}
.ctl button.play[aria-pressed="true"]{background:var(--C);color:#fff;border-color:var(--C)}
#track{position:relative;height:46px;margin:8px 6px 0}
#track .base{position:absolute;left:0;right:0;top:16px;height:4px;background:#cfc4b2;border-radius:2px}
#track .yr{position:absolute;top:24px;margin-left:4px;font-family:Oswald,sans-serif;font-size:14px;color:var(--muted)}
#track .yt{position:absolute;top:10px;width:1px;height:16px;background:#b3a893}
#track .dot{position:absolute;top:9px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;padding:0;transition:transform .15s}
#track .dot:hover{transform:scale(1.25)}
#track .dot.dim{opacity:.22}
#track .dot.cur{transform:scale(1.45);box-shadow:0 0 0 3px var(--ink)}
#track .dot:focus-visible{outline:3px solid #f0b400}
/* svg */
.cty{transition:fill .7s, stroke .7s, opacity .6s;stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.ovl{transition:fill .7s, stroke .7s, opacity .6s;stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.occ,.front,.blk{transition:opacity .6s}
.lbl{font-family:Oswald,sans-serif;font-weight:500;letter-spacing:.08em;fill:#2a2420;fill-opacity:.78;paint-order:stroke;stroke:rgba(255,253,248,.75);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.sea{font-family:"Atkinson Hyperlegible",sans-serif;font-style:italic;fill:#4d7a92;pointer-events:none;letter-spacing:.05em}
.city{font-size:12px;fill:#1f1a16;paint-order:stroke;stroke:#fffdf8;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mk{font-size:14px;font-weight:700;fill:#1f1a16;paint-order:stroke;stroke:#fffdf8;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.alabel{font-size:13px;font-weight:700;font-style:italic;paint-order:stroke;stroke:#fffdf8;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.arrow .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.anim .ln.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
.anim .hd,.anim .alabel{opacity:0;animation:fade .4s ease-out 1s forwards}
.anim .ln.ret,.anim .halo.ret{opacity:0;animation:fade .8s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.pulse{fill:none;stroke-width:2;opacity:0;animation:pulse 1.6s ease-out 2 forwards}
@keyframes pulse{from{r:6;opacity:.9}to{r:30;opacity:0}}
@media (max-width:900px){
  #mapwrap{height:52vh}
  #panel{margin:10px auto 20px;border-radius:10px}
  header h1{font-size:18px}
  .ctl{margin-left:0}
}
</style>
</head>
<body>
<header>
  <h1>La Prima guerra mondiale <span>1914–1918 · mappa degli eventi</span></h1>
  <div class="sp"></div>
  <button class="hbtn" id="btnLegend" aria-pressed="true">Legenda</button>
  <button class="hbtn" id="btnPanel" aria-pressed="true">Scheda evento</button>
</header>
<main id="main">
  <section id="mapwrap">
    <svg id="map" aria-label="Mappa dell'Europa e del Medio Oriente durante la Prima guerra mondiale"></svg>
    <div id="loading">Caricamento della mappa…</div>
    <div id="datebadge"><div class="y"></div><div class="l"></div></div>
    <div class="zoomctl"><button id="zin" title="Ingrandisci">+</button><button id="zout" title="Riduci">−</button><button id="zreset" title="Torna alla vista dell'evento" style="font-size:15px">⟲</button></div>
    <div id="legendBox"></div>
  </section>
  <footer>
  <div class="frow">
    <div class="chips" id="chips"></div>
    <div class="ctl">
      <button id="prev" title="Evento precedente (←)">◀</button>
      <button id="play" class="play" aria-pressed="false" title="Riproduzione automatica (spazio)">▶ Riproduci</button>
      <button id="next" title="Evento successivo (→)">▶</button>
    </div>
  </div>
  <div id="track"></div>
</footer>
  <aside id="panel" aria-live="polite"></aside>
</main>

 text:"All'inizio del 1914 le grandi potenze europee sono legate da due sistemi di alleanze. Da una parte la <b>Triplice Intesa</b>: Francia, Regno Unito e Impero russo. Dall'altra la <b>Triplice Alleanza</b>: Impero tedesco, Austria-Ungheria e Italia. Da anni crescono la corsa agli armamenti, le rivalità per le colonie e i nazionalismi, soprattutto nei Balcani.",

{d:'1914-10-29', sd:'1915-02-05', lab:'29 ottobre 1914 – febbraio 1915', title:"L'Impero ottomano entra in guerra", fr:'ottomano', focus:[23.5,28,50,46.5],
 text:"L'<b>Impero ottomano</b> si schiera con la Germania: le sue navi bombardano i porti russi del Mar Nero. Si aprono nuovi fronti: nel <b>Caucaso</b>, dove l'offensiva ottomana fallisce a Sarıkamış (dicembre 1914 – gennaio 1915); in <b>Mesopotamia</b>, dove i britannici sbarcano per proteggere il petrolio e occupano Bassora; e presso il <b>Canale di Suez</b>, attaccato senza successo nel febbraio 1915.",
 rem:"La guerra diventa mondiale: si combatte anche in Asia, in Africa e sugli oceani.",
 q:"Perché il Canale di Suez era così importante per il Regno Unito?",
 ar:[{s:'E',p:[[49.7,29.3],[48.6,29.95],[47.85,30.45]]},{s:'C',p:[[41.3,39.95],[42.0,40.25],[42.48,40.32]]},{s:'C',p:[[34.6,31.0],[33.6,30.8],[32.7,30.62]]}],
 mk:[{p:[42.57,40.33],n:'Sarıkamış',ty:'battle'},{p:[47.8,30.5],n:'Bassora',ty:'battle',a:'b'},{p:[32.55,30.6],n:'Canale di Suez',ty:'battle',a:'l'},{p:[33.0,44.7],n:'attacchi navali ottomani',ty:'naval',a:'t'}]},
{d:'1915-04-22', lab:'22 aprile 1915', title:'Ypres: arrivano i gas', fr:'occidentale', focus:[0.8,49.6,5.4,51.6],
 text:"Nella seconda battaglia di Ypres, in Belgio, l'esercito tedesco usa per la prima volta su larga scala un gas tossico: il <b>cloro</b>, liberato da migliaia di bombole e spinto dal vento verso le trincee nemiche. Presto entrambi gli schieramenti useranno gas sempre più pericolosi, come il fosgene e l'iprite (che prende il nome proprio da Ypres). La maschera antigas diventa parte dell'equipaggiamento di ogni soldato.",
 rem:"Scienza e industria vengono messe al servizio della guerra: armi chimiche, aerei, mitragliatrici, carri armati.",
 q:"Il cloro è più pesante dell'aria: perché questo lo rendeva pericoloso per chi stava in trincea?",
 ar:[{s:'C',p:[[3.25,50.98],[3.05,50.93],[2.92,50.9]],t:'nube di cloro'}],
 mk:[{p:[2.88,50.85],n:'Ypres',ty:'battle',a:'b'}]},
{d:'1915-04-25', sd:'1915-08-15', lab:'Aprile 1915 – gennaio 1916', title:'Gallipoli: l’attacco ai Dardanelli', fr:'ottomano', focus:[22.5,38.3,31,42.4],
 text:"Britannici e francesi vogliono conquistare lo stretto dei <b>Dardanelli</b> per arrivare a Costantinopoli e aprire una via di rifornimento verso la Russia. Dopo il fallimento dell'attacco navale (marzo 1915), il 25 aprile sbarcano sulla penisola di <b>Gallipoli</b>, insieme a soldati australiani e neozelandesi (ANZAC). Gli ottomani, guidati tra gli altri da Mustafa Kemal (il futuro Atatürk), resistono. A gennaio 1916 gli Alleati si ritirano dopo enormi perdite da entrambe le parti.",
 rem:"Ancora oggi Australia e Nuova Zelanda ricordano i caduti di Gallipoli il 25 aprile (Anzac Day).",
 q:"Perché controllare uno stretto di mare può essere decisivo in una guerra?",
 ar:[{s:'E',p:[[25.4,39.75],[25.9,39.95],[26.3,40.08]],t:'attacco navale (marzo)'},{s:'E',p:[[25.3,40.4],[25.8,40.3],[26.25,40.24]]},{s:'E',p:[[25.5,39.55],[26.15,40.02]]},
     {s:'E',r:1,p:[[26.1,40.15],[25.7,40.05],[25.3,39.98]],t:'evacuazione (genn. 1916)'}],
 mk:[{p:[26.28,40.24],n:'Anzac Cove',ty:'battle',a:'t'},{p:[26.18,40.05],n:'Capo Helles',ty:'battle',a:'b'}]},
{d:'1915-05-02', sd:'1915-09-30', lab:'Maggio – settembre 1915', title:'Gorlice-Tarnów e la «grande ritirata» russa', fr:'orientale', focus:[15.5,47,31,58],
 text:"Tedeschi e austro-ungarici sfondano il fronte russo tra <b>Gorlice e Tarnów</b>. È l'inizio della «grande ritirata» russa: in pochi mesi la Russia perde la Galizia, la Polonia (Varsavia cade il 5 agosto), la Lituania e parte della Lettonia. Milioni di soldati russi vengono uccisi, feriti o fatti prigionieri e moltissimi civili fuggono verso est.",
 rem:"Nel 1915 il fronte orientale si sposta di centinaia di chilometri, al contrario di quello occidentale.",
 q:"Confronta i due fronti: perché a est la guerra era molto più «di movimento» che a ovest?",
 ar:[{s:'C',p:[[21.05,49.72],[22.3,49.8],[23.3,49.84],[23.95,49.85]],t:'Gorlice → Leopoli'},{s:'C',p:[[20.3,53.0],[20.95,52.32]]},{s:'C',p:[[20.15,52.0],[20.9,52.2]]},
     {s:'C',p:[[22.8,54.7],[24.0,55.6],[25.3,56.4]]},{s:'C',p:[[22.7,51.2],[23.6,52.05],[25.0,52.6]]},
     {s:'E',r:1,p:[[24.8,52.7],[27.0,53.3],[29.6,53.9]],t:'ritirata russa e profughi'}],
 mk:[{p:[21.1,49.66],n:'Gorlice',ty:'battle',a:'b'},{p:[21.01,52.23],n:'Varsavia (5 ago.)',ty:'battle',a:'l'},{p:[23.7,52.1],n:'Brest-Litovsk',ty:'battle',a:'b'}]},
{d:'1915-05-07', lab:'7 maggio 1915', title:'Il Lusitania e la guerra sottomarina', fr:'mare', focus:[-13,47.5,7,59.5],
 text:"Il transatlantico britannico <b>Lusitania</b> viene silurato da un sottomarino tedesco (U-Boot) al largo dell'Irlanda: muoiono quasi 1.200 persone, tra cui 128 cittadini statunitensi. La Germania usa i sottomarini per colpire le navi dirette in Gran Bretagna, che a sua volta blocca con la flotta i rifornimenti verso la Germania (linea tratteggiata blu). L'affondamento indigna l'opinione pubblica americana.",
 rem:"Il controllo dei mari serve a far arrivare, o a bloccare, cibo, materie prime e armi.",
 q:"Perché la guerra sottomarina poteva spingere gli Stati Uniti a entrare in guerra?",
 mk:[{p:[-8.55,51.25],n:'Lusitania affondato',ty:'naval',a:'b'},{p:[-7.9,50.6],n:'',ty:'sub'}]},
{d:'1915-05-24', sd:'1915-07-15', lab:'24 maggio 1915', title:"L'Italia entra in guerra", fr:'italiano', focus:[6,40.3,18.8,48],
 text:"Dopo mesi di scontro tra neutralisti e interventisti, l'Italia firma in segreto il <b>Patto di Londra</b> (26 aprile 1915): in caso di vittoria otterrà Trentino, Alto Adige, Trieste, l'Istria e parte della Dalmazia. Il <b>24 maggio 1915</b> dichiara guerra all'Austria-Ungheria. Il fronte corre sulle Alpi e lungo il fiume <b>Isonzo</b>, dove il generale Cadorna lancerà undici offensive con pochi guadagni e moltissimi caduti.",
 rem:"L'Italia cambia schieramento: dalla Triplice Alleanza passa con l'Intesa.",
 q:"Quali territori voleva ottenere l'Italia? Trovali sulla mappa.",
 ar:[{s:'E',p:[[12.4,45.85],[13.0,45.95],[13.5,46.0]],t:"verso l'Isonzo"}],
 mk:[{p:[13.62,46.05],n:"Battaglie dell'Isonzo",ty:'battle'},{p:[13.6,45.83],n:'Carso',ty:'battle',a:'b'}]},
{d:'1915-10-07', sd:'1916-01-25', lab:'Ottobre 1915 – gennaio 1916', title:'La Bulgaria in guerra, la Serbia invasa', fr:'balcanico', focus:[13,38.5,29.5,47],
 text:"Nell'ottobre 1915 la <b>Bulgaria</b> entra in guerra con gli Imperi centrali. Attaccata da nord da tedeschi e austro-ungarici e da est dai bulgari, la <b>Serbia</b> viene occupata. L'esercito serbo, insieme a molti civili, si ritira in pieno inverno attraverso le montagne dell'Albania; i sopravvissuti vengono portati dalle navi alleate, anche italiane, sull'isola di Corfù. Intanto francesi e britannici sbarcano a <b>Salonicco</b>, in Grecia, aprendo un nuovo fronte.",
 rem:"Chi fugge dalla guerra diventa profugo: la Grande guerra colpisce anche milioni di civili.",
 q:"Seguendo le frecce tratteggiate, descrivi il percorso della ritirata serba.",
 ar:[{s:'C',p:[[19.8,45.45],[20.4,44.85],[20.9,43.8]]},{s:'C',p:[[23.3,43.2],[22.3,43.25],[21.65,43.0]],t:'Bulgaria'},{s:'C',p:[[23.1,42.0],[22.25,41.7]]},
     {s:'E',r:1,p:[[21.2,42.9],[20.4,42.5],[19.6,41.95],[19.45,41.32]],t:'ritirata serba'},{s:'E',r:1,p:[[19.35,41.2],[19.3,40.5],[19.85,39.65]],t:'verso Corfù'},
     {s:'E',p:[[24.6,39.5],[23.7,40.15],[23.0,40.58]],t:'sbarco a Salonicco'}],
 mk:[{p:[20.46,44.82],n:'Belgrado (ott. 1915)',ty:'battle'},{p:[19.92,39.62],n:'Corfù',ty:'event',a:'l'}]},
{d:'1916-02-21', sd:'1916-03-01', lab:'21 febbraio – 18 dicembre 1916', title:'Verdun', fr:'occidentale', focus:[2.5,47.8,8,50.6],
 text:"La Germania attacca <b>Verdun</b>, città-fortezza simbolo per la Francia, con l'obiettivo di logorare l'esercito francese. La battaglia dura dieci mesi; i francesi resistono anche grazie alla «Voie Sacrée», la strada da cui passavano ogni giorno migliaia di camion con uomini e rifornimenti. Alla fine il fronte torna quasi dov'era all'inizio: i morti, tra francesi e tedeschi, sono circa 300.000.",
 rem:"Verdun è il simbolo della «guerra di logoramento».",
 q:"Che cosa significa «logorare» il nemico? Questa strategia funzionò?",
 ar:[{s:'C',p:[[5.7,49.5],[5.5,49.3],[5.4,49.2]]},{s:'E',p:[[5.16,48.77],[5.28,48.98],[5.36,49.1]],t:'Voie Sacrée'}],
 mk:[{p:[5.38,49.16],n:'Verdun',ty:'battle'}]},
{d:'1916-05-15', sd:'1916-08-10', lab:'Maggio – agosto 1916', title:'La Strafexpedition e la presa di Gorizia', fr:'italiano', focus:[9.8,44.9,15.2,47.1],
 text:"Nel maggio 1916 l'Austria-Ungheria lancia dal Trentino la <b>Strafexpedition</b> («spedizione punitiva») contro l'Italia, considerata traditrice dell'alleanza. L'attacco sugli Altipiani di Asiago viene fermato. Ad agosto, nella sesta battaglia dell'Isonzo, l'esercito italiano conquista <b>Gorizia</b>: è uno dei pochi successi dopo mesi di combattimenti sul Carso.",
 rem:"Sul fronte italiano si combatte in montagna: freddo, valanghe e rifornimenti difficilissimi.",
 q:"Quali difficoltà in più comporta combattere in alta montagna?",
 ar:[{s:'C',p:[[11.15,46.1],[11.35,45.92],[11.5,45.82]],t:'Strafexpedition'},{s:'E',p:[[13.35,45.95],[13.58,45.94]]}],
 mk:[{p:[11.5,45.87],n:'Asiago',ty:'battle',a:'l'},{p:[13.62,45.94],n:'Gorizia (9 ago.)',ty:'battle'}]},
{d:'1916-05-31', sd:'1916-06-01', lab:'31 maggio – 1 giugno 1916', title:'Jutland: la grande battaglia navale', fr:'mare', focus:[-6,50,16,62],
 text:"Nel Mare del Nord, al largo della penisola dello <b>Jutland</b> (Danimarca), si scontrano la flotta britannica e quella tedesca: è la più grande battaglia navale della guerra, con circa 250 navi. I britannici perdono più navi e marinai, ma dopo lo scontro la flotta tedesca resta quasi sempre nei porti. Il blocco navale britannico continua e in Germania cominciano a mancare cibo e materie prime.",
 rem:"Una battaglia si può «vincere» sul campo e perdere dal punto di vista strategico.",
 q:"Chi ha vinto davvero a Jutland? Motiva la risposta.",
 ar:[{s:'E',p:[[-3.0,58.85],[1.5,58.1],[5.3,57.0]],t:'flotta britannica'},{s:'C',p:[[8.1,53.7],[7.6,55.3],[6.4,56.55]],t:'flotta tedesca'}],
 mk:[{p:[5.9,56.8],n:'Jutland',ty:'naval',a:'t'},{p:[-3.1,58.9],n:'Scapa Flow',ty:'event',a:'l'},{p:[8.12,53.52],n:'Wilhelmshaven',ty:'event',a:'b'}]},
{d:'1916-06-04', sd:'1916-09-20', lab:'Giugno – settembre 1916', title:"L'offensiva Brusilov", fr:'orientale', focus:[19.5,46.4,30.5,53.3],
 text:"Il generale russo <b>Brusilov</b> attacca l'Austria-Ungheria su un fronte molto ampio, con attacchi a sorpresa in molti punti contemporaneamente. È una delle offensive di maggior successo della guerra: i russi avanzano in Volinia e in Bucovina e catturano centinaia di migliaia di prigionieri. Ma le perdite russe sono enormi e l'Austria-Ungheria si salva solo grazie all'aiuto tedesco.",
 rem:"Dopo questa offensiva l'esercito russo è esausto: la crisi della Russia si avvicina.",
 q:"Perché attaccare in molti punti contemporaneamente può mettere in difficoltà il nemico?",
 ar:[{s:'E',p:[[26.3,50.7],[25.6,50.75],[25.1,50.85]],t:'Luck'},{s:'E',p:[[26.6,48.6],[26.0,48.3],[25.4,48.0]],t:'Bucovina'},{s:'E',p:[[25.85,49.45],[25.1,49.2]]}],
 mk:[{p:[25.33,50.75],n:'Luck',ty:'battle',a:'t'},{p:[25.94,48.29],n:'Černivci',ty:'battle',a:'b'}]},
{d:'1916-07-01', lab:'1 luglio – 18 novembre 1916', title:'La battaglia della Somme', fr:'occidentale', focus:[0.2,48.9,5.4,51.1],
 text:"Britannici e francesi attaccano sul fiume <b>Somme</b>, anche per alleggerire la pressione su Verdun. Il primo giorno l'esercito britannico subisce circa 57.000 perdite (tra morti, feriti e dispersi), di cui quasi 20.000 morti: il giorno più tragico della sua storia. Il 15 settembre compaiono per la prima volta i <b>carri armati</b>. Dopo quasi cinque mesi gli Alleati hanno avanzato di una decina di chilometri.",
 rem:"I carri armati nascono per superare trincee, crateri e filo spinato.",
 q:"Quali problemi tecnici doveva risolvere un carro armato per attraversare la «terra di nessuno»?",
 ar:[{s:'E',p:[[2.45,49.93],[2.65,49.98],[2.88,50.02]]}],
 mk:[{p:[2.7,49.95],n:'Somme',ty:'battle',a:'b'},{p:[2.85,50.08],n:'Flers: primi carri armati',ty:'event'}]},
{d:'1916-08-27', sd:'1917-01-15', lab:'Agosto – dicembre 1916', title:'La Romania entra in guerra e viene sconfitta', fr:'balcanico', focus:[19.5,42.5,31,49],
 text:"Incoraggiata dai successi di Brusilov, la <b>Romania</b> entra in guerra con l'Intesa e invade la Transilvania, abitata da molti romeni ma appartenente all'Ungheria. La controffensiva di tedeschi, austro-ungarici, bulgari e ottomani è rapidissima: il 6 dicembre 1916 cade <b>Bucarest</b>. Il governo romeno si rifugia in Moldavia, a nord-est. La Germania si impadronisce del grano e del petrolio romeni.",
 rem:"In una guerra lunga, le risorse (cibo, petrolio, carbone) sono decisive.",
 q:"Perché il petrolio era diventato così importante nella guerra moderna?",
 ar:[{s:'E',p:[[25.6,45.45],[25.0,46.0],[24.45,46.4]],t:'in Transilvania'},{s:'E',p:[[26.45,46.15],[25.85,46.5]]},
     {s:'C',p:[[23.0,45.6],[24.2,45.2],[25.5,44.8],[25.95,44.52]]},{s:'C',p:[[25.4,43.62],[25.85,44.15],[26.02,44.38]],t:'dal Danubio'},{s:'C',p:[[27.8,43.6],[28.3,44.2],[28.4,44.9]],t:'Dobrugia'}],
 mk:[{p:[26.1,44.43],n:'Bucarest (6 dic.)',ty:'battle',a:'b'}]},
{d:'1917-03-15', sd:'1917-03-16', lab:'Marzo 1917', title:'Russia: cade lo zar', fr:'orientale', focus:[14,41.5,46,62],
 text:"In Russia la guerra ha portato fame, prezzi altissimi e milioni di morti. A <b>Pietrogrado</b> scoppiano scioperi e rivolte, e i soldati si uniscono ai manifestanti: è la <b>Rivoluzione di febbraio</b> (secondo il calendario russo dell'epoca; per noi è marzo). Lo zar Nicola II abdica e nasce un governo provvisorio, che però decide di continuare la guerra. Intanto, a ovest, i tedeschi si ritirano su una linea fortificata più corta e più facile da difendere: la linea Hindenburg.",
 rem:"La guerra mette in crisi anche il «fronte interno»: fame e scontento possono far cadere un governo.",
 q:"Perché si parla di «Rivoluzione di febbraio» se per il nostro calendario avvenne a marzo?",
 mk:[{p:[30.3,59.94],n:'Pietrogrado: rivoluzione',ty:'event',a:'l'}]},
{d:'1917-04-06', lab:'6 aprile 1917', title:'Gli Stati Uniti entrano in guerra', fr:'mare', focus:[-13,42.5,16,59.5],
 text:"Dal febbraio 1917 la Germania riprende la guerra sottomarina «illimitata»: gli U-Boot attaccano senza preavviso anche le navi dei paesi neutrali. Viene inoltre scoperto il <b>telegramma Zimmermann</b>, con cui la Germania proponeva al Messico un'alleanza contro gli Stati Uniti. Il 6 aprile 1917 gli <b>USA</b> dichiarano guerra alla Germania. Le truppe americane arriveranno in Francia soprattutto nel 1918: oltre due milioni di soldati entro la fine della guerra.",
 rem:"Gli USA portano all'Intesa soldati, navi, denaro e la loro enorme industria.",
 q:"Quali sono le due ragioni principali dell'intervento americano?",
 ar:[{s:'E',p:[[-12.5,46.6],[-8.0,47.5],[-4.7,48.33]],t:'truppe USA'}],
 mk:[{p:[-4.49,48.39],n:'Brest: sbarco degli americani',ty:'event',a:'b'},{p:[-9.5,50.6],n:'',ty:'sub'},{p:[-6.3,48.7],n:'',ty:'sub'},{p:[-10.5,54.0],n:'',ty:'sub'},{p:[-3.0,49.9],n:'',ty:'sub'},{p:[1.5,57.5],n:'',ty:'sub'}]},
{d:'1917-03-11', sd:'1917-12-10', lab:'1917', title:'Medio Oriente: Baghdad, Aqaba, Gerusalemme', fr:'ottomano', focus:[28.5,27.5,49.8,38.5],
 text:"In Mesopotamia i britannici, dopo la dura sconfitta di Kut (aprile 1916), conquistano <b>Baghdad</b> l'11 marzo 1917. In Arabia, dal 1916, le tribù arabe guidate dallo sceriffo della Mecca Hussein si ribellano agli ottomani, con l'aiuto dell'ufficiale britannico T. E. Lawrence («Lawrence d'Arabia»): nel luglio 1917 conquistano il porto di <b>Aqaba</b>. Da sud avanza l'esercito britannico del generale Allenby: <b>Gerusalemme</b> si arrende il 9 dicembre 1917.",
 rem:"Le promesse fatte agli arabi e gli accordi segreti tra Regno Unito e Francia (Sykes-Picot, 1916) pesano ancora oggi sulla storia del Medio Oriente.",
 q:"Perché i britannici sostenevano la rivolta araba?",
 ar:[{s:'E',p:[[47.8,30.6],[46.6,31.4],[45.8,32.4],[44.6,33.2]],t:'Bassora → Baghdad'},{s:'E',p:[[32.4,30.8],[33.8,31.1],[34.5,31.45],[35.1,31.75]],t:'Allenby'},
     {s:'E',p:[[37.4,27.5],[36.3,28.4],[35.1,29.45]],t:'rivolta araba'}],
 mk:[{p:[45.82,32.5],n:'Kut',ty:'battle'},{p:[44.4,33.31],n:'Baghdad (11 mar.)',ty:'battle',a:'t'},{p:[35.0,29.53],n:'Aqaba (6 lug.)',ty:'battle',a:'l'},
     {p:[34.6,31.35],n:'Gaza e Beersheba',ty:'battle',a:'l'},{p:[35.21,31.77],n:'Gerusalemme (9 dic.)',ty:'event'}]},
{d:'1917-10-24', sd:'1917-11-12', lab:'24 ottobre – 12 novembre 1917', title:'Caporetto', fr:'italiano', focus:[10.3,44.9,14.9,47],
 text:"Il 24 ottobre 1917 austro-ungarici e tedeschi sfondano il fronte italiano a <b>Caporetto</b> (oggi Kobarid, in Slovenia), con nuove tattiche: bombardamenti brevi anche con i gas e piccoli reparti d'assalto che si infiltrano nelle valli. L'esercito italiano si ritira in disordine; quasi 300.000 soldati vengono fatti prigionieri e centinaia di migliaia di civili fuggono. Il nuovo fronte si ferma sul fiume <b>Piave</b> e sul <b>Monte Grappa</b>. Cadorna viene sostituito dal generale Diaz.",
 rem:"«Caporetto» è diventato in italiano sinonimo di sconfitta disastrosa.",
 q:"Perché un grande fiume come il Piave poteva essere una buona linea di difesa?",
 ar:[{s:'C',p:[[13.58,46.25],[13.25,46.12],[12.8,45.97],[12.38,45.86]]},{s:'C',p:[[13.55,45.98],[13.1,45.85],[12.62,45.73]]}],
 mk:[{p:[13.58,46.25],n:'Caporetto',ty:'battle'},{p:[11.8,45.87],n:'Monte Grappa',ty:'battle',a:'l'},{p:[12.45,45.72],n:'Piave',ty:'battle',a:'b'}]},
{d:'1917-11-07', sd:'1918-03-04', lab:'Novembre 1917 – marzo 1918', title:'La Russia esce dalla guerra', fr:'orientale', focus:[14,41.5,46,62],
 text:"Con la <b>Rivoluzione d'ottobre</b> (7 novembre 1917 per il nostro calendario) i bolscevichi di Lenin prendono il potere: avevano promesso «pace, terra e pane». A dicembre firmano un armistizio e il 3 marzo 1918 la <b>pace di Brest-Litovsk</b>: la Russia rinuncia a Polonia, Paesi baltici, Finlandia e Ucraina, che passano sotto il controllo tedesco o diventano indipendenti. La Germania può spostare molte divisioni sul fronte occidentale.",
 rem:"Finito il fronte orientale, la Germania tenta l'ultima grande offensiva a ovest.",
 q:"Perché i bolscevichi accettarono di cedere così tanti territori pur di avere la pace?",
 mk:[{p:[30.3,59.94],n:"Rivoluzione d'ottobre",ty:'event',a:'l'},{p:[23.7,52.1],n:'Pace di Brest-Litovsk',ty:'sign',a:'b'}]},
{d:'1918-03-21', sd:'1918-07-15', lab:'Marzo – luglio 1918', title:'Le offensive di primavera tedesche', fr:'occidentale', focus:[-0.5,47.8,7.3,51.6],
 text:"Prima che arrivino in massa gli americani, la Germania lancia una serie di grandi offensive, usando le truppe arrivate dal fronte russo e reparti d'assalto. I tedeschi avanzano di decine di chilometri, come non succedeva dal 1914, e arrivano di nuovo sulla <b>Marna</b>, a meno di 100 km da Parigi. Ma non riescono a sfondare e perdono moltissimi soldati esperti. A luglio, nella seconda battaglia della Marna, gli Alleati contrattaccano.",
 rem:"È l'ultima occasione della Germania per vincere la guerra.",
 q:"Perché la Germania aveva tanta fretta di attaccare nella primavera del 1918?",

    const d=polyD(fr.p,false);
    el('path',{d,fill:'none',stroke:'#2b1a10','stroke-width':5,'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke'},g);

function size(){const r=svg.getBoundingClientRect();return [Math.max(r.width,50),Math.max(r.height,50)];}
function fitView(b){
  const [W,H]=size();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const ll of bboxSamples(b)){const p=P(ll);x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const padL=W>700?20:10,pad=24;
  const k=Math.min((W-pad*2)/(x1-x0),(H-pad*2)/(y1-y0));
  return {k,x:W/2-k*(x0+x1)/2+padL/2,y:H/2-k*(y0+y1)/2};

function baseK(){return fitView(REGION).k;}
function applyView(){

const S=ll=>{const p=P(ll);return [p[0]*view.k+view.x,p[1]*view.k+view.y];};

function drawOverlay(z){

  for(const s of STATE_LABELS){if(s.z&&z<s.z)continue;const p=S(s.p);if(!inV(p))continue;
    let t=s.t;if(s.ru){const st=statusOf('RU',date);t=date>='1917-11-07'?'RUSSIA BOLSCEVICA':'IMPERO RUSSO';}

function star(cx,cy,R,r,n=8){let d='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,rr=i%2?r:R;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1);}return d+'Z';}

function smooth(pts){
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  if(pts.length===2)return d+`L${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];

function drawArrows(animate){

    const ret=a.r?' ret':'';
    h+=`<g class="arrow">`+
      `<path class="ln halo ${a.r?'ret':'draw'}" d="${d}" pathLength="1" stroke="#fffdf8" stroke-opacity=".85" stroke-width="${w+4}" fill="none" stroke-linecap="round"/>`+
      `<path class="ln ${a.r?'ret':'draw'}" d="${d}" pathLength="1" stroke="${col}" stroke-width="${w}" ${a.r?'stroke-dasharray="0.035 0.025"':''}/>`+
      `<path class="hd" d="M${end[0].toFixed(1)},${end[1].toFixed(1)}L${(bx+px).toFixed(1)},${(by+py).toFixed(1)}L${(bx-px).toFixed(1)},${(by-py).toFixed(1)}Z" fill="${col}" stroke="#fffdf8" stroke-width="1.5"/>`;
    if(a.t){const mid=a.p[Math.floor((a.p.length-1)/2)],mp=S(mid),mp2=S(a.p[Math.min(a.p.length-1,Math.floor((a.p.length-1)/2)+1)]);
      const lx=(mp[0]+mp2[0])/2+(-dy)*16,ly=(mp[1]+mp2[1])/2+dx*16;
      h+=`<text class="alabel" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" fill="${col}">${esc(a.t)}</text>`;}
    h+=`</g>`;
  }
  gArrows.setAttribute('class',animate?'anim':'');
  gArrows.innerHTML=h;
}

function applyState(ev){
  const date=ev.sd||ev.d;currentState=date;
  const fin=!!ev.final,EMP=new Set(['DE','AH','RU','OT']);
  const st=k=>k.split('|')[0];
  for(const e of countryEls){e.style.fill=e.style.stroke=fillFor(e.dataset.key,date);e.style.opacity=fin&&!EMP.has(st(e.dataset.key))?.35:1;
    e.setAttribute('filter',fin&&EMP.has(st(e.dataset.key))?'url(#glow)':'');}
  for(const e of ovlEls){e.style.fill=e.style.stroke=fillFor(e.dataset.key,date);e.style.opacity=fin&&!EMP.has(e.dataset.key)?.35:1;}
  for(const {o,e} of occEls)e.setAttribute('opacity',active(o,date)?1:0);
  for(const {fr,g} of frontEls)g.setAttribute('opacity',active(fr,date)?1:0);
  for(const e of blkEls)e.setAttribute('opacity',active(BLOCKADE,date)?.9:0);
  const y=$('#datebadge .y'),l=$('#datebadge .l');y.textContent=ev.d.slice(0,4);l.textContent=ev.lab;
}

/* ---- animazione zoom ---- */
function animateTo(target,dur=950){
  cancelAnimationFrame(animId);gArrows.innerHTML='';
  const [W,H]=size(),a={...view},b=target;
  const ca=[(W/2-a.x)/a.k,(H/2-a.y)/a.k],cb=[(W/2-b.x)/b.k,(H/2-b.y)/b.k];
  const t0=performance.now(),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const step=now=>{let t=Math.min(1,(now-t0)/dur),e=ease(t);
    const k=Math.exp(Math.log(a.k)*(1-e)+Math.log(b.k)*e),cx=ca[0]+(cb[0]-ca[0])*e,cy=ca[1]+(cb[1]-ca[1])*e;
    view={k,x:W/2-cx*k,y:H/2-cy*k};applyView();
    if(t<1)animId=requestAnimationFrame(step);else{PULSE=true;applyView();PULSE=false;drawArrows(true);}};
  animId=requestAnimationFrame(step);
}

/* ---- pan e zoom manuale ---- */
function enablePanZoom(){
  let drag=null;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)<3)return;
    userZoom=true;view={...view,x:drag.vx+dx,y:drag.vy+dy};applyView();drawArrows(false);});
  const end=()=>{drag=null;};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015));},{passive:false});
  const zc=f=>{const [W,H]=size();zoomAt(W/2,H/2,f);};
  $('#zin').onclick=()=>zc(1.4);$('#zout').onclick=()=>zc(1/1.4);
  $('#zreset').onclick=()=>{userZoom=false;animateTo(fitView(EVENTS[cur].focus),600);};
}
function zoomAt(px,py,f){const k=Math.max(baseK()*0.6,Math.min(baseK()*14,view.k*f));const r=k/view.k;
  userZoom=true;view={k,x:px-(px-view.x)*r,y:py-(py-view.y)*r};applyView();drawArrows(false);}

/* =========================================================
   INTERFACCIA
   ========================================================= */
let filter=null,playTimer=null;
function visibleIdx(){return EVENTS.map((e,i)=>i).filter(i=>!filter||EVENTS[i].fr===filter);}
function buildUI(){
  // filtri
  const chips=$('#chips');
  const mk=(key,label,color)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',key===filter?'true':'false');
    b.innerHTML=(color?`<i style="background:${color}"></i>`:'')+esc(label);b.onclick=()=>{filter=key;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
      updateDots();const v=visibleIdx();if(!v.includes(cur))show(v[0]);};chips.appendChild(b);};
  mk(null,'Tutti gli eventi');for(const k in FRONTS_INFO)mk(k,FRONTS_INFO[k].n,FRONTS_INFO[k].c);
  // linea del tempo
  const tr=$('#track');tr.innerHTML='<div class="base"></div>';
  const n=EVENTS.length,pos=i=>1.2+i*(97.6/(n-1));
  let lastY='';EVENTS.forEach((ev,i)=>{const y=ev.d.slice(0,4);if(y!==lastY){const x=i?(pos(i)+pos(i-1))/2:0;
    tr.insertAdjacentHTML('beforeend',`${i?`<div class="yt" style="left:${x}%"></div>`:''}<div class="yr" style="left:${i?x:0}%;${i?'':'transform:none'}">${y}</div>`);lastY=y;}});
  EVENTS.forEach((ev,i)=>{const x=pos(i);
    const b=document.createElement('button');b.className='dot';b.style.left=x+'%';b.style.background=FRONTS_INFO[ev.fr].c;
    b.title=ev.lab+' – '+ev.title;b.setAttribute('aria-label',b.title);b.onclick=()=>{stopPlay();show(i);};b.dataset.i=i;tr.appendChild(b);});
  $('#prev').onclick=()=>{stopPlay();step(-1);};$('#next').onclick=()=>{stopPlay();step(1);};
  $('#play').onclick=()=>playTimer?stopPlay():startPlay();
  document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(e.key==='ArrowRight'){stopPlay();step(1);}else if(e.key==='ArrowLeft'){stopPlay();step(-1);}else if(e.key===' '){e.preventDefault();playTimer?stopPlay():startPlay();}});
  $('#btnLegend').onclick=e=>{const lb=$('#legendBox');if(!lb)return;lb.hidden=!lb.hidden;e.currentTarget.setAttribute('aria-pressed',String(!lb.hidden));};
  $('#btnPanel').onclick=e=>{const m=$('#main');m.classList.toggle('nopanel');e.currentTarget.setAttribute('aria-pressed',String(!m.classList.contains('nopanel')));};
  buildLegend();
  if(window.innerHeight<950||window.innerWidth<900){$('#legendBox').hidden=true;$('#btnLegend').setAttribute('aria-pressed','false');}
}
function buildLegend(){
  const sw=(inner)=>`<svg width="34" height="18" viewBox="0 0 34 18">${inner}</svg>`;
  const it=(s,t)=>`<div class="lg">${s}<span>${t}</span></div>`;
  $('#legendBox').innerHTML='<h3>Legenda</h3>'+
    it(sw('<rect x="1" y="2" width="32" height="14" rx="3" fill="#4a7cc9"/>'),'Intesa e alleati (sfumature = Stati diversi)')+
    it(sw('<rect x="1" y="2" width="32" height="14" rx="3" fill="#c8553d"/><rect x="17" y="2" width="16" height="14" rx="3" fill="#ee9a4d"/>'),'Imperi centrali')+
    it(sw('<rect x="1" y="2" width="32" height="14" rx="3" fill="#d6cfbf"/>'),'Paesi neutrali')+
    it(sw('<rect x="1" y="2" width="32" height="14" rx="3" fill="#c9bfdc"/>'),'Uscito dalla guerra')+
    it(sw('<rect x="1" y="2" width="32" height="14" rx="3" fill="#eee" /><g stroke="#9e2f16" stroke-width="1.8">'+[...Array(7)].map((_,i)=>`<line x1="${i*5}" y1="18" x2="${i*5+8}" y2="0"/>`).join('')+'</g>'),'Territorio occupato (colore di chi occupa)')+
    it(sw('<path d="M2 9 L32 9" stroke="#2b1a10" stroke-width="5"/><path d="M2 9 L32 9" stroke="#f6e7c4" stroke-width="1.6" stroke-dasharray="5 5"/>'),'Linea del fronte')+
    it(sw('<path d="M2 9 L24 9" stroke="#b5361b" stroke-width="4"/><path d="M33 9 L22 3 L22 15Z" fill="#b5361b"/>'),'Attacco degli Imperi centrali')+
    it(sw('<path d="M2 9 L24 9" stroke="#1d4f9a" stroke-width="4"/><path d="M33 9 L22 3 L22 15Z" fill="#1d4f9a"/>'),"Attacco dell'Intesa")+
    it(sw('<path d="M2 9 L24 9" stroke="#555" stroke-width="4" stroke-dasharray="4 3"/><path d="M33 9 L22 3 L22 15Z" fill="#555"/>'),'Ritirata')+
    it(sw(`<path d="${star(17,9,8,3.3)}" fill="#d42a17" stroke="#fff"/>`),'Battaglia')+
    it(sw('<path d="M2 9 L32 9" stroke="#1d4f9a" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>'),'Blocco navale britannico')+
    '<div style="margin-top:6px;font-size:12px;color:#6b6258">Confini del 1914 (semplificati). Trascina per spostare la mappa, usa la rotellina o i pulsanti + / − per ingrandire.</div>';
}
function updateDots(){
  document.querySelectorAll('#track .dot').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('cur',i===cur);b.classList.toggle('dim',!!filter&&EVENTS[i].fr!==filter);});
}
function step(dir){const v=visibleIdx();let p=v.indexOf(cur);if(p<0){p=v.findIndex(i=>i>cur);if(dir<0)p--;else p=p-1;}const n=v[p+dir];if(n!==undefined)show(n);else if(playTimer)stopPlay();}
function startPlay(){$('#play').setAttribute('aria-pressed','true');$('#play').textContent='❚❚ Pausa';const tick=()=>{const v=visibleIdx();if(v.indexOf(cur)>=v.length-1){stopPlay();return;}step(1);};playTimer=setInterval(tick,11000);}
function stopPlay(){clearInterval(playTimer);playTimer=null;$('#play').setAttribute('aria-pressed','false');$('#play').textContent='▶ Riproduci';}

function show(i,first){
  cur=i;const ev=EVENTS[i];const fi=FRONTS_INFO[ev.fr];
  const v=visibleIdx();
  $('#panel').innerHTML=`<span class="tag" style="background:${fi.c}">${esc(fi.n)}</span><span class="count">${v.indexOf(i)+1} / ${v.length}</span>
    <div class="when">${esc(ev.lab)}</div><h2>${esc(ev.title)}</h2><p class="txt">${ev.text}</p>
    <div class="box r"><b>Da ricordare</b>${esc(ev.rem)}</div><div class="box q"><b>Per discutere in classe</b>${esc(ev.q)}</div>
    <div class="navbtns"><button id="pb">◀ Indietro</button><button id="nb">Avanti ▶</button></div>`;
  $('#pb').onclick=()=>{stopPlay();step(-1);};$('#nb').onclick=()=>{stopPlay();step(1);};
  $('#pb').disabled=v.indexOf(i)<=0;$('#nb').disabled=v.indexOf(i)>=v.length-1;
  $('#panel').scrollTop=0;
  updateDots();
  if(!proj)return;
  applyState(ev);userZoom=false;
  const target=fitView(ev.focus);
  if(first){view=target;PULSE=true;applyView();PULSE=false;drawArrows(true);}else animateTo(target);
}

main();
</script>
