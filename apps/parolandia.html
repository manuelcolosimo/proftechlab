<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Parolandia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: quaderno a quadretti (chiaro) / lavagna (scuro). Mappa per classi → schede illustrate → esercizi uno alla volta */
:root{
  --paper:#f7f9fc; --grid:#dfe8f4; --card:#ffffff; --line:#cdd9e8;
  --ink:#1c2f52; --ink-soft:#56688a;
  --blue:#2350c4; --red:#cf2e3b; --green:#1d8048; --sun:#b57f00; --sun-solid:#f2b705;
  --blue-bg:#e6edfc; --red-bg:#fbe7e8; --green-bg:#e3f4ea; --sun-bg:#fdf3d4;
  --on-accent:#ffffff;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a2722; --grid:#22332c; --card:#21312b; --line:#365046;
  --ink:#eef3ea; --ink-soft:#a9bbb0;
  --blue:#93b4ff; --red:#ff8a8a; --green:#7fdc9f; --sun:#ffd45e; --sun-solid:#ffd45e;
  --blue-bg:#263a52; --red-bg:#4a2a2d; --green-bg:#21452f; --sun-bg:#4a3f1f;
  --on-accent:#13201b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a2722; --grid:#22332c; --card:#21312b; --line:#365046;
  --ink:#eef3ea; --ink-soft:#a9bbb0;
  --blue:#93b4ff; --red:#ff8a8a; --green:#7fdc9f; --sun:#ffd45e; --sun-solid:#ffd45e;
  --blue-bg:#263a52; --red-bg:#4a2a2d; --green-bg:#21452f; --sun-bg:#4a3f1f;
  --on-accent:#13201b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hl{color:var(--blue);font-weight:700;background:var(--blue-bg);padding:0 .25em;border-radius:6px}
.c-red{--c:var(--red);--cb:var(--red-bg)} .c-blue{--c:var(--blue);--cb:var(--blue-bg)}
.c-green{--c:var(--green);--cb:var(--green-bg)} .c-sun{--c:var(--sun);--cb:var(--sun-bg)}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:2.3rem;line-height:1;letter-spacing:.5px}
.brand h1 span{color:var(--red)}
.brand p{margin:4px 0 0;color:var(--ink-soft);font-size:1rem}
.total{font-family:var(--f-display);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.total b{color:var(--sun)}

/* schede classi */
.tabs-wrap{overflow-x:auto;margin:0 -4px;padding:4px}
.tabs{display:flex;gap:8px;min-width:max-content}
.tab{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;text-align:left;line-height:1.2}
.tab b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.02rem}
.tab small{color:var(--ink-soft);font-size:.82rem;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--paper);opacity:.8}

/* mappa */
.tappa{margin-top:24px}
.tappa-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tappa-h h2{font-size:1.35rem}
.tappa-h small{color:var(--ink-soft);font-size:.95rem}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lv{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:84px;transition:transform .12s}
.lv:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
.lv .n{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;font-weight:700;background:var(--cb);color:var(--c)}
.lv .t{min-width:0}
.lv .t b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.2}
.lv .t span{display:block;color:var(--ink-soft);font-size:.86rem;line-height:1.3}
.stars{color:var(--sun-solid);letter-spacing:2px;font-size:1rem}
.stars .off{color:var(--line)}
.lv:disabled{opacity:.55;cursor:not-allowed}
.lv:disabled .n{background:var(--grid);color:var(--ink-soft)}
footer{margin-top:36px;color:var(--ink-soft);font-size:.9rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.linkbtn{background:none;border:none;text-decoration:underline;color:var(--ink-soft);padding:4px 0;font-size:.9rem}

/* pagina */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .back{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.95rem}
.bar .lvname{font-family:var(--f-display);font-size:1.02rem;color:var(--ink-soft)}
.sheet{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 22px 22px 44px}
.sheet::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:1.5px;font-size:.8rem;color:var(--c,var(--blue))}

/* scheda spiegazione */
.lesson{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.lesson-head{background:var(--c);color:var(--on-accent);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lesson-head h2{font-size:1.65rem;line-height:1.15}
.lesson-head .step{font-family:var(--f-display);font-size:.95rem;background:color-mix(in srgb,var(--on-accent) 22%,transparent);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.lesson-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px}
.lesson-body p{margin:0;max-width:62ch;font-size:1.15rem}
.texts{display:flex;flex-direction:column;gap:8px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c,var(--blue))}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:12px 22px;font-family:var(--f-display);font-weight:600;font-size:1.1rem;background:var(--blue);color:var(--on-accent);min-height:52px}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.go{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.speak{background:var(--blue-bg);color:var(--blue);border:none;border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:700;align-self:flex-start}

/* mascotte e trucco */
.trick{display:flex;gap:12px;align-items:flex-end}
.trick svg{flex:none;width:56px;height:70px}
.bubble{position:relative;background:var(--sun-bg);border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:1.05rem;min-width:0}
.bubble b{display:block;font-family:var(--f-display);color:var(--sun);font-size:.85rem;text-transform:uppercase;letter-spacing:1px}

/* ---- componenti visivi ---- */
.vis{display:flex;flex-direction:column;gap:10px}
.pop>*{animation:pop .4s cubic-bezier(.3,1.5,.6,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pop{from{transform:scale(.5) translateY(8px)}to{transform:none}}
/* lettere */
.v-letters{display:flex;flex-wrap:wrap;gap:8px}
.lt{width:46px;height:52px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.5rem;background:var(--blue-bg);color:var(--blue)}
.lt.v{background:var(--red-bg);color:var(--red)}
.v-letters.big .lt{width:76px;height:86px;font-size:2.6rem;border-radius:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.95rem;color:var(--ink-soft)}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--k)}
/* sillabe */
.v-syl{display:flex;flex-direction:column;gap:10px}
.syl-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sy{font-family:var(--f-display);font-weight:600;font-size:1.6rem;padding:6px 14px;border-radius:12px;letter-spacing:1px}
.sy:nth-child(odd){background:var(--blue-bg);color:var(--blue)}
.sy:nth-child(even){background:var(--sun-bg);color:var(--sun)}
.clap{margin-left:8px;font-family:var(--f-display);color:var(--ink-soft);font-size:1rem;white-space:nowrap}
.clap b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);margin-left:4px}
/* giusto / sbagliato */
.v-vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs-h{font-family:var(--f-display);font-size:.9rem;text-transform:uppercase;letter-spacing:1px}
.vs-h.ok{color:var(--green)} .vs-h.no{color:var(--red)}
.vs{border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-size:1.25rem;display:flex;gap:10px;align-items:center;min-width:0;overflow-wrap:anywhere}
.vs.ok{background:var(--green-bg);color:var(--green)}
.vs.no{background:var(--red-bg);color:var(--red)}
.vs.no span{text-decoration:line-through;text-decoration-thickness:3px}
.vs i{font-style:normal;font-weight:700;flex:none}
/* gruppi */
.v-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grp{border-radius:14px;overflow:hidden;border:2px solid var(--gc)}
.grp h4{margin:0;background:var(--gc);color:var(--on-accent);font-family:var(--f-display);font-weight:600;font-size:1rem;padding:8px 12px;line-height:1.25}
.grp ul{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.grp li{font-size:1.08rem}
.g0{--gc:var(--red)} .g1{--gc:var(--blue)} .g2{--gc:var(--green)} .g3{--gc:var(--sun)}
/* tabella */
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:1.02rem}
.tbl th{background:var(--cb,var(--blue-bg));color:var(--c,var(--blue));font-family:var(--f-display);font-weight:600;text-align:left;padding:8px 12px;white-space:nowrap}
.tbl td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700}
/* frase analizzata */
.v-sent{display:flex;flex-wrap:wrap;gap:14px 10px;align-items:flex-start;padding:6px 0}
.chunk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chunk .w{font-family:var(--f-display);font-size:1.45rem;font-weight:500;padding:2px 10px 4px;border-bottom:5px solid var(--sc,transparent);border-radius:8px 8px 0 0;background:var(--sb,transparent)}
.chunk .l{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--sc,var(--ink-soft));text-align:center;max-width:16ch;line-height:1.2}
.k-s{--sc:var(--red);--sb:var(--red-bg)} .k-p{--sc:var(--blue);--sb:var(--blue-bg)}
.k-o{--sc:var(--green);--sb:var(--green-bg)} .k-x{--sc:var(--sun);--sb:var(--sun-bg)}
/* linea del tempo */
.v-time{list-style:none;margin:0;padding:0;display:flex;position:relative}
.v-time::before{content:"";position:absolute;left:0;right:0;top:34px;height:4px;background:var(--line);border-radius:2px}
.v-time li{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;min-width:0}
.v-time .when{font-size:.85rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.6px;height:22px}
.v-time .dot{width:18px;height:18px;border-radius:50%;background:var(--c,var(--blue));border:4px solid var(--card);box-shadow:0 0 0 2px var(--c,var(--blue))}
.v-time .vb{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.v-time .tn{font-size:.82rem;color:var(--ink-soft)}
.v-time li.now .vb{color:var(--c)}
/* trasformazioni */
.v-swap{display:flex;flex-direction:column;gap:8px}
.sw{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 14px}
.sw .a,.sw .b{font-size:1.1rem;min-width:0}
.sw .ar{color:var(--ink-soft);font-weight:700;font-size:1.3rem}
.badge{font-family:var(--f-display);font-size:.85rem;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.ok{background:var(--green-bg);color:var(--green)} .badge.no{background:var(--red-bg);color:var(--red)}
/* carte da girare */
.v-reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rv{border:2px dashed var(--c,var(--blue));background:var(--cb,var(--blue-bg));border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:88px}
.rv .rq{font-family:var(--f-display);font-size:1.12rem;font-weight:500}
.rv .ra{font-size:1.02rem}
.rv .tap{font-size:.82rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.rv[aria-expanded="true"]{border-style:solid;background:var(--card)}
/* equazioni */
.v-eq{display:flex;flex-direction:column;gap:8px}
.eq{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eq .t{font-family:var(--f-display);font-size:1.3rem;padding:4px 12px;border-radius:10px;background:var(--blue-bg);color:var(--blue)}
.eq .t.r{background:var(--green-bg);color:var(--green);font-weight:600}
.eq .op{font-weight:700;color:var(--ink-soft);font-size:1.2rem}
/* gradini */
.v-steps{display:flex;align-items:flex-end;gap:8px}
.stp{flex:1;border-radius:12px 12px 0 0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-width:0;background:var(--sc);color:var(--on-accent)}
.stp b{font-family:var(--f-display);font-size:1.2rem;line-height:1.15;overflow-wrap:anywhere}
.stp small{font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;font-weight:700;opacity:.9}
/* parole chip */
.v-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-display);font-size:1.35rem;padding:6px 16px;border-radius:999px;background:var(--cb,var(--blue-bg));color:var(--c,var(--blue));font-weight:600}
/* esempio */
.example{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:12px 16px;font-size:1.2rem;font-family:var(--f-display)}

/* esercizi */
.progress{display:flex;gap:6px;flex:1;min-width:140px}
.progress i{flex:1;height:10px;border-radius:6px;background:var(--grid)}
.progress i.ok{background:var(--green)} .progress i.no{background:var(--red)} .progress i.cur{background:var(--blue)}
.q{font-size:1.4rem;font-family:var(--f-display);font-weight:500;margin:6px 0 18px;line-height:1.4}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;padding:0 .2em}
.blank.ok{color:var(--green);border-color:var(--green)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;font-size:1.22rem;font-family:var(--f-display);font-weight:500;min-height:64px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.no{border-color:var(--red);background:var(--red-bg)}
.opt:disabled{cursor:default}
.tokens{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tok{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px 16px;font-size:1.3rem;font-family:var(--f-display);min-width:52px}
.tok.letter{width:60px;height:64px;padding:0;font-size:1.8rem;font-weight:600}
.tok.sel{border-color:var(--blue);background:var(--blue-bg)}
.tok.ok{border-color:var(--green);background:var(--green-bg)}
.tok.no{border-color:var(--red);background:var(--red-bg)}
.tok.miss{border-color:var(--green);border-style:dashed}
.tok:disabled{cursor:default}
.fb{margin-top:18px;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--green-bg)} .fb.no{background:var(--red-bg)}
.fb h3{font-size:1.3rem}
.fb.ok h3{color:var(--green)} .fb.no h3{color:var(--red)}
.fb p{margin:0;font-size:1.05rem}
.fb .row{display:flex;justify-content:flex-end}

/* risultato */
.result{text-align:center;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.result svg{width:84px;height:104px}
.result .big{font-size:3.2rem;color:var(--sun-solid);letter-spacing:6px}
.result .big .off{color:var(--line)}
.result h2{font-size:2rem}
.result p{font-size:1.15rem;color:var(--ink-soft);margin:0 auto;max-width:46ch}
.result .nav{justify-content:center;margin-top:12px}

/* ripasso */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal .lesson{max-width:680px;width:100%;max-height:88vh;overflow:auto}
@media (max-width:560px){
  body{font-size:17px}
  .sheet{padding:18px 16px 18px 34px}
  .sheet::before{left:18px}
  .q{font-size:1.22rem}
  .tok.letter{width:52px;height:58px}
  .brand h1{font-size:1.9rem}
  .lesson-head{padding:14px 16px} .lesson-body{padding:16px}
  .lesson-head h2{font-size:1.4rem}
  .v-letters.big .lt{width:58px;height:66px;font-size:2rem}
  .sw{grid-template-columns:1fr auto;}
  .sw .ar{display:none}
  .sw .b{grid-column:1}
  .v-time{flex-direction:column;gap:10px;padding-left:8px}
  .v-time::before{left:16px;right:auto;top:0;bottom:0;width:4px;height:auto}
  .v-time li{flex-direction:row;text-align:left;gap:10px}
  .v-time .when{order:3;height:auto;font-size:.75rem}
  .v-time .dot{order:0} .v-time .vb{order:1} .v-time .tn{order:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
/* ---------- utilità ---------- */
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*(.+?)\*/g,'<span class="hl">$1</span>');
const plain=s=>String(s).replace(/\*/g,'').replace(/_{3}/g,'…');
const canSpeak='speechSynthesis' in window;

const VOC='AEIOU',CONS='BCDFGLMNPRSTVZ';
const W1=['LUNA','MELA','SOLE','CASA','PANE','TOPO','FATA','NIDO','RANA','VASO','PERA','DADO','RUOTA','PALLA','LIBRO'];
function genL1(){
  const tapV=()=>{const w=pick(W1),L=[...w];return {t:'tap',letters:true,q:`Tocca tutte le *vocali* di ${w}.`,w:L,a:L.map((c,i)=>VOC.includes(c)?i:-1).filter(i=>i>=0),h:'Le vocali sono 5: A, E, I, O, U.'}};
  const tapC=()=>{const w=pick(W1),L=[...w];return {t:'tap',letters:true,q:`Tocca tutte le *consonanti* di ${w}.`,w:L,a:L.map((c,i)=>VOC.includes(c)?-1:i).filter(i=>i>=0),h:'Le consonanti sono tutte le lettere che non sono A, E, I, O, U.'}};
  const vow=()=>C('Quale lettera è una *vocale*?',pick(VOC),shuffle([...CONS]).slice(0,2),'Le vocali sono 5: A, E, I, O, U.');
  const con=()=>C('Quale lettera è una *consonante*?',pick(CONS),shuffle([...VOC]).slice(0,2),'Se non è A, E, I, O, U, è una consonante.');
  const cnt=()=>{const w=pick(W1),vs=[...w].filter(c=>VOC.includes(c)),n=vs.length;return C(`Quante vocali ci sono in ${w}?`,String(n),[n-1,n+1,n+2].filter(x=>x>0).slice(0,2).map(String),`In ${w} le vocali sono: ${vs.join(', ')}.`)};
  return shuffle([tapV(),vow(),tapC(),con(),cnt(),pick([tapV,tapC])()]);
}
const SIL=[['CA','SA'],['GAT','TO'],['PAL','LA'],['PA','NE'],['TA','VO','LO'],['FIO','RE'],['LI','BRO'],['MAM','MA'],['SCUO','LA'],['FAR','FAL','LA'],['E','LE','FAN','TE'],['PAL','LO','NE'],['GE','LA','TO'],['SO','LE'],['MA','TI','TA'],['TOR','TA'],['FI','NE','STRA']];
function genL2(){
  const divide=s=>{const w=s.join(''),pos=[];let p=0;s.slice(0,-1).forEach(x=>{p+=x.length;pos.push(p)});
    const right=s.join(' - '),wrong=new Set();
    pos.forEach((q,k)=>[-1,1].forEach(d=>{const np=pos.slice();np[k]=q+d;
      if(!np.every((v,i)=>v>(i?np[i-1]:0)&&v<w.length))return;
      const parts=[];let last=0;np.forEach(v=>{parts.push(w.slice(last,v));last=v});parts.push(w.slice(last));
      const str=parts.join(' - ');if(str!==right)wrong.add(str)}));
    return C(`Come si divide in sillabe *${w}*?`,right,shuffle([...wrong]).slice(0,2),`Si divide così: ${right}. Le doppie si separano sempre.`)};
  const count=s=>{const n=s.length;return C(`Quante sillabe ha *${s.join('')}*?`,String(n),[n-1,n+1,n+2].filter(x=>x>0).slice(0,2).map(String),`Batti le mani: ${s.join(' - ')}. Sono ${n} sillabe.`)};
  return shuffle(shuffle(SIL).slice(0,6).map((s,i)=>i<3?divide(s):count(s)));
}

  C('“Se fossi partito prima, saresti arrivato in tempo” è un periodo ipotetico della...','irrealtà',['possibilità','realtà']),C('Se ___ più attento, non avresti sbagliato.','fossi stato',['saresti stato','eri']),
  C('Se vincessi la lotteria, ___ il giro del mondo.','farei',['facessi','avrò fatto']),C('Se piove, ___ a casa.','restiamo',['restassimo','saremmo restati']),
  C('Quale frase è corretta?','Se lo sapessi, te lo direi.',['Se lo saprei, te lo direi.','Se lo sapessi, te lo dicessi.']),C('In “Se studi, sarai promosso” la protasi è...','se studi',['sarai promosso']),
  C('L\'apodosi è...','la conseguenza, cioè la principale',['la condizione introdotta da SE','una relativa'])]}
];
LEVELS.forEach((l,i)=>{l.id=i;l.g=TAPPE[l.tappa].g});
const inGroup=g=>LEVELS.filter(l=>l.g===g);
const numInGroup=l=>inGroup(l.g).indexOf(l)+1;

/* ---------- salvataggio (solo su questo dispositivo) ---------- */
const KEY='parolandia-v1';
let save={stars:{},open:false,g:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stars)save=Object.assign(save,s)}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const starsOf=i=>save.stars[i]||0;
const unlocked=i=>{const l=LEVELS[i];if(save.open)return true;const p=LEVELS[i-1];return !p||p.g!==l.g||starsOf(i-1)>=1};
const starHtml=n=>'<span class="stars" aria-label="'+n+' stelle su 3">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></span>';

const app=document.getElementById('app');
const PER=6;
let st={};

/* ---------- mappa ---------- */
function home(){
  if(canSpeak)try{speechSynthesis.cancel()}catch(e){}
  const g=save.g||0;
  const tot=LEVELS.reduce((s,l)=>s+starsOf(l.id),0);
  let h=`<header class="top"><div class="brand"><svg viewBox="0 0 60 76" width="44" height="56" aria-hidden="true">${MASCOT.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><div><h1>Parola<span>ndia</span></h1><p>La grammatica italiana, un passo alla volta</p></div></div>
    <div class="total"><b>★</b> ${tot} / ${LEVELS.length*3} stelle</div></header>
    <div class="tabs-wrap"><div class="tabs" role="tablist">${GROUPS.map((G,i)=>{const L=inGroup(i);const s=L.reduce((a,l)=>a+starsOf(l.id),0);
      return `<button class="tab" role="tab" aria-selected="${i===g}" data-g="${i}"><b>${esc(G.name)}</b><small>${esc(G.sub)} · ★ ${s}/${L.length*3}</small></button>`}).join('')}</div></div>`;
  TAPPE.forEach((t,ti)=>{
    if(t.g!==g)return;
    h+=`<section class="tappa"><div class="tappa-h"><h2>${esc(t.name)}</h2><small>${esc(t.sub)}</small></div><div class="levels">`;
    LEVELS.filter(l=>l.tappa===ti).forEach(l=>{
      const u=unlocked(l.id),n=numInGroup(l);
      h+=`<button class="lv ${t.color}" data-l="${l.id}" ${u?'':'disabled'}><span class="n">${n}</span><span class="t"><b>${esc(l.title)}</b><span>${u?esc(l.sub):'Prima completa il livello '+(n-1)}</span>${starHtml(starsOf(l.id))}</span></button>`;
    });
    h+='</div></section>';
  });
  h+=`<footer><span>Le stelle restano salvate solo su questo dispositivo.</span>
    <span><button class="linkbtn" id="unlock">${save.open?'Blocca i livelli in ordine':'Per l\'insegnante: sblocca tutti i livelli'}</button> · <button class="linkbtn" id="reset">Ricomincia da capo</button></span></footer>`;
  app.innerHTML=h;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{save.g=+b.dataset.g;persist();home()});
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>lesson(+b.dataset.l,0));
  document.getElementById('unlock').onclick=()=>{save.open=!save.open;persist();home()};
  const r=document.getElementById('reset');
  r.onclick=()=>{if(r.dataset.sure){save={stars:{},open:false,g:save.g};persist();home()}else{r.dataset.sure=1;r.textContent='Sicuro? Tocca ancora per cancellare le stelle'}};
  window.scrollTo(0,0);
}

/* ---------- componenti visivi ---------- */
function vis(v){
  const I=(i)=>`style="--i:${i}"`;
  switch(v.k){
  case 'letters':return `<div class="v-letters pop ${v.big?'big':''}">${[...v.s].map((c,i)=>`<span class="lt ${VOC.includes(c)?'v':''}" ${I(i)}>${c}</span>`).join('')}</div>`;
  case 'legend':return `<div class="legend"><span style="--k:var(--red)">vocali</span><span style="--k:var(--blue)">consonanti</span></div>`;
  case 'syl':return `<div class="v-syl">${v.w.map(w=>{const s=w.split('-');return `<div class="syl-row pop">${s.map((x,i)=>`<span class="sy" ${I(i)}>${esc(x)}</span>`).join('')}<span class="clap">👏 battiti <b>${s.length}</b></span></div>`}).join('')}</div>`;
  case 'vs':return `<div class="v-vs"><span class="vs-h ok">Si scrive così</span><span class="vs-h no">Non così</span>${v.rows.map(([a,b])=>`<div class="vs ok"><i>✔</i><span>${esc(a)}</span></div><div class="vs no"><i>✘</i><span>${esc(b)}</span></div>`).join('')}</div>`;
  case 'groups':return `<div class="v-groups">${v.g.map((g,i)=>`<div class="grp g${i%4}"><h4>${esc(g[0])}</h4><ul>${g.slice(1).map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  case 'table':return `<div class="tbl"><table><thead><tr>${v.head.map(x=>`<th>${md(x)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(x=>`<td>${md(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  case 'sent':return `<div class="v-sent pop">${v.parts.map(([t,l,k],i)=>`<span class="chunk ${k?'k-'+k:''}" ${I(i)}><span class="w">${esc(t)}</span>${l?`<span class="l">${esc(l)}</span>`:''}</span>`).join('')}</div>`;
  case 'time':return `<ol class="v-time">${v.items.map(([w,vb,tn,now])=>`<li class="${now?'now':''}"><span class="when">${esc(w)}</span><span class="dot"></span><span class="vb">${esc(vb)}</span><span class="tn">${esc(tn)}</span></li>`).join('')}</ol>`;
  case 'swap':return `<div class="v-swap">${v.rows.map(([a,b,ok])=>`<div class="sw"><span class="a">${md(a)}</span><span class="ar">→</span><span class="b">${md(b)}</span>${ok===undefined?'<span></span>':`<span class="badge ${ok?'ok':'no'}">${ok?'✔ funziona':'✘ non funziona'}</span>`}</div>`).join('')}</div>`;
  case 'reveal':return `<div class="v-reveal">${v.items.map(([q,a])=>`<button class="rv" aria-expanded="false"><span class="rq">${md(q)}</span><span class="tap">Tocca per scoprire</span><span class="ra" hidden>${md(a)}</span></button>`).join('')}</div>`;
  case 'eq':return `<div class="v-eq">${v.rows.map(r=>`<div class="eq pop">${r.map((x,i)=>['+','='].includes(x)?`<span class="op">${x}</span>`:`<span class="t ${i===r.length-1?'r':''}" ${I(i)}>${esc(x)}</span>`).join('')}</div>`).join('')}</div>`;
  case 'steps':{const cols=['var(--green)','var(--blue)','var(--red)'];return `<div class="v-steps pop">${v.items.map(([l,t],i)=>`<div class="stp" style="--sc:${cols[i%3]};min-height:${70+i*40}px;--i:${i}"><small>${esc(l)}</small><b>${esc(t)}</b></div>`).join('')}</div>`}
  case 'chips':return `<div class="v-chips pop">${v.items.map((x,i)=>`<span class="chip" ${I(i)}>${esc(x)}</span>`).join('')}</div>`;
  case 'ex':return `<div class="example">${md(v.t)}</div>`;
  }return '';
}
function bindReveal(root){root.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!o);b.querySelector('.ra').hidden=o;b.querySelector('.tap').hidden=!o})}
const trickHtml=t=>`<div class="trick">${MASCOT}<div class="bubble"><b>Virgola ti suggerisce</b>${md(t)}</div></div>`;
function cardBody(c){
  return `<div class="texts">${c.p.map(x=>`<p>${md(x)}</p>`).join('')}</div>${(c.v||[]).map(x=>`<div class="vis">${vis(x)}</div>`).join('')}${c.trick?trickHtml(c.trick):''}`;
}

/* ---------- spiegazione ---------- */
function lesson(id,page){
  const L=LEVELS[id],c=L.ex[page],col=TAPPE[L.tappa].color,last=page===L.ex.length-1;
  app.innerHTML=`<div class="bar"><button class="back" id="bk">← Mappa</button><span class="lvname">${esc(GROUPS[L.g].name)} · Livello ${numInGroup(L)} · ${esc(L.title)}</span></div>
  <article class="lesson ${col}">
    <div class="lesson-head"><h2>${esc(c.h||L.title)}</h2><span class="step">Scheda ${page+1} di ${L.ex.length}</span></div>
    <div class="lesson-body">
      ${cardBody(c)}
      ${canSpeak?'<button class="speak" id="sp">🔊 Ascolta</button>':''}
      <div class="nav">
        <div class="dots">${L.ex.map((_,i)=>`<i class="${i<=page?'on':''}"></i>`).join('')}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn ghost" id="pv" ${page===0?'disabled':''}>Indietro</button>
          <button class="btn ${last?'go':''}" id="nx">${last?'Facciamo gli esercizi!':'Avanti'}</button>
        </div>
      </div>
    </div></article>`;
  bindReveal(app);
  document.getElementById('bk').onclick=home;
  document.getElementById('pv').onclick=()=>lesson(id,page-1);
  document.getElementById('nx').onclick=()=>last?startQuiz(id):lesson(id,page+1);
  const sp=document.getElementById('sp');if(sp)sp.onclick=()=>speak((c.h||L.title)+'. '+c.p.join(' ')+(c.trick?' Trucco: '+c.trick:''));
  window.scrollTo(0,0);
}

/* ---------- esercizi ---------- */
function startQuiz(id){
  const L=LEVELS[id];
  const qs=(L.gen?L.gen():shuffle(L.pool).slice(0,PER)).map(q=>q.t==='c'?{...q,o:shuffle(q.o)}:q);
  st={id,qs,i:0,res:[]};
  showQ();
}
function qText(q,fill,cls){
  let s=md(q.q);
  if(s.includes('___'))s=s.replace('___',`<span class="blank ${cls||''}">${fill?esc(fill):'&nbsp;'}</span>`);
  return s;
}
function showQ(){
  const L=LEVELS[st.id],q=st.qs[st.i],col=TAPPE[L.tappa].color;
  const prog=st.qs.map((_,i)=>`<i class="${i<st.res.length?(st.res[i]?'ok':'no'):(i===st.i?'cur':'')}"></i>`).join('');
  const caseT=s=>L.up&&q.t==='c'?s.toUpperCase():s;
  const body=q.t==='c'
    ?`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(caseT(o))}</button>`).join('')}</div>`
    :`<div class="tokens">${q.w.map((w,i)=>`<button class="tok ${q.letters?'letter':''}" data-i="${i}" aria-pressed="false">${esc(w)}</button>`).join('')}</div><button class="btn" id="chk" disabled>Controlla</button>`;
  app.innerHTML=`<div class="bar"><button class="back" id="bk">← Mappa</button><div class="progress" aria-label="Domanda ${st.i+1} di ${st.qs.length}">${prog}</div></div>
  <div class="sheet ${col}">
    <div class="eyebrow">Esercizio ${st.i+1} di ${st.qs.length} · ${esc(L.title)}</div>
    <div class="q" id="qt">${qText(q)}</div>
    ${body}
    <div id="fb"></div>
    <div class="nav" style="margin-top:20px">
      <button class="linkbtn" id="rv">Rileggi la spiegazione</button>
      ${canSpeak?'<button class="speak" id="sp">🔊 Ascolta la domanda</button>':''}
    </div>
  </div>`;
  document.getElementById('bk').onclick=home;
  document.getElementById('rv').onclick=review;
  const sp=document.getElementById('sp');if(sp)sp.onclick=()=>speak(q.q+(q.t==='c'?'. '+q.o.join(', oppure, '):''));
  if(q.t==='c'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=q.o[+b.dataset.i]===q.a;
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.o[+x.dataset.i]===q.a)x.classList.add('ok')});
      if(!ok)b.classList.add('no');
      if(q.q.includes('___'))document.getElementById('qt').innerHTML=qText(q,caseT(q.a),'ok');
      feedback(ok,q);
    });
  }else{
    const toks=[...app.querySelectorAll('.tok')],chk=document.getElementById('chk');
    toks.forEach(b=>b.onclick=()=>{b.classList.toggle('sel');b.setAttribute('aria-pressed',b.classList.contains('sel'));chk.disabled=!toks.some(t=>t.classList.contains('sel'))});
    chk.onclick=()=>{
      const sel=toks.filter(t=>t.classList.contains('sel')).map(t=>+t.dataset.i);
      const ok=sel.length===q.a.length&&sel.every(i=>q.a.includes(i));
      toks.forEach(t=>{const i=+t.dataset.i;t.disabled=true;t.classList.remove('sel');
        if(q.a.includes(i))t.classList.add(sel.includes(i)?'ok':'miss');else if(sel.includes(i))t.classList.add('no')});
      chk.hidden=true;feedback(ok,q);
    };
  }
  window.scrollTo(0,0);
}
const YES=['Esatto!','Giusto!','Perfetto!','Ottimo lavoro!','Sì, è così!','Ben fatto!'];
function feedback(ok,q){
  st.res.push(ok);
  const L=LEVELS[st.id],hint=q.h||L.tip||'';
  let correct='';
  if(!ok)correct=q.t==='c'?`La risposta giusta è <b>${esc(L.up?q.a.toUpperCase():q.a)}</b>.`
    :`${q.letters?'Le lettere giuste':'La risposta giusta'} ha il bordo verde: <b>${q.a.map(i=>esc(q.w[i])).join(', ')}</b>.`;
  const lastQ=st.i===st.qs.length-1,fb=document.getElementById('fb');
  fb.innerHTML=`<div class="fb ${ok?'ok':'no'}" role="status"><h3>${ok?pick(YES):'Non ancora, ma ci sei quasi!'}</h3>
    ${correct?`<p>${correct}</p>`:''}${hint?`<p>${md(hint)}</p>`:''}
    <div class="row"><button class="btn ${ok?'go':''}" id="nx">${lastQ?'Vedi il risultato':'Avanti'}</button></div></div>`;
  const nx=document.getElementById('nx');nx.focus({preventScroll:true});
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  nx.onclick=()=>{if(lastQ)result();else{st.i++;showQ()}};
}
function review(){
  const L=LEVELS[st.id];
  const m=$(`<div class="modal" role="dialog" aria-modal="true" aria-label="Ripasso"><article class="lesson ${TAPPE[L.tappa].color}">
    <div class="lesson-head"><h2>Ripasso: ${esc(L.title)}</h2></div>
    <div class="lesson-body">${L.ex.map(cardBody).join('<hr style="border:none;border-top:2px dashed var(--line);width:100%;margin:4px 0">')}
    <div class="nav"><span></span><button class="btn" id="cl">Torna all'esercizio</button></div></div></article></div>`);
  document.body.appendChild(m);bindReveal(m);
  const close=()=>m.remove();
  m.querySelector('#cl').onclick=close;m.onclick=e=>{if(e.target===m)close()};
  m.querySelector('#cl').focus();
}

/* ---------- risultato ---------- */
function result(){
  const L=LEVELS[st.id],n=st.res.filter(Boolean).length,tot=st.qs.length;
  const stars=n===tot?3:n>=tot-1?2:n>=Math.ceil(tot/2)?1:0;
  if(stars>starsOf(st.id)){save.stars[st.id]=stars;persist()}
  const msg=['Rileggiamo insieme la spiegazione e riproviamo: ce la puoi fare!','Bene! Hai sbloccato il livello successivo. Se vuoi più stelle, riprova.','Molto bene! Ancora un piccolo sforzo per 3 stelle.','Fantastico! Tutte giuste!'][stars];
  const next=LEVELS[st.id+1],canNext=next&&next.g===L.g&&unlocked(next.id);
  app.innerHTML=`<div class="bar"><button class="back" id="bk">← Mappa</button><span class="lvname">Livello ${numInGroup(L)} · ${esc(L.title)}</span></div>
  <div class="sheet result ${TAPPE[L.tappa].color}">
    ${MASCOT}
    <h2>${n} giuste su ${tot}</h2>
    <div class="big" aria-label="${stars} stelle su 3">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <p>${msg}</p>
    <div class="nav">
      ${stars===0?`<button class="btn ghost" id="ex">Rileggi la spiegazione</button>`:''}
      <button class="btn ${canNext?'ghost':''}" id="again">Rifai il livello</button>
      ${canNext?`<button class="btn go" id="next">Avanti: ${esc(next.title)}</button>`:''}
    </div></div>`;
  document.getElementById('bk').onclick=home;
  document.getElementById('again').onclick=()=>startQuiz(st.id);
  const ex=document.getElementById('ex');if(ex)ex.onclick=()=>lesson(st.id,0);
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>lesson(next.id,0);
  window.scrollTo(0,0);
}

/* controllo interno dei dati */
LEVELS.forEach(l=>{const qs=l.gen?[...l.gen(),...l.gen(),...l.gen()]:l.pool;
  if(!l.gen&&qs.length<PER)console.warn('Poche domande:',l.title,qs.length);
  qs.forEach(q=>{
  if(q.t==='c'&&(new Set(q.o).size!==q.o.length||q.o.length<2))console.warn('Domanda da controllare:',l.title,q.q,q.o);
  if(q.t==='tap'&&(q.a.some(i=>i>=q.w.length)||!q.a.length))console.warn('Indice errato:',l.title,q.q)})});

home();
})();
</script>

<script src="a11y.js"></script>
</body></html>
