<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detective dell'opera</title>
<link rel="stylesheet" href="ptl.css">
<style>
:root { --accent: #9d174d; }
.layout { display: grid; grid-template-columns: minmax(300px, 1.2fr) 1fr; gap: 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.quadro { background: #3b2f2a; padding: 14px; border-radius: 6px; box-shadow: inset 0 0 0 6px #c9a227, 0 6px 16px rgba(0,0,0,.25); position: sticky; top: 8px; }
#cv { width: 100%; display: block; background: #fff; touch-action: manipulation; cursor: crosshair; }
.passi { display: flex; gap: 4px; flex-wrap: wrap; }
.passi button { font: 400 17px var(--font-hand); border: 2px solid var(--ink); border-radius: 99px; background: #fff; padding: 1px 10px; cursor: pointer; }
.passi button[aria-current="step"] { background: var(--giallo); }
.passi button.fatto { background: #d7f2e1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font: 400 19px var(--font-hand); border: 2px solid var(--ink); border-radius: 99px; background: #fff; padding: 2px 12px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--giallo); }
.campo { display: grid; gap: 4px; font-weight: 700; }
.campo input, .campo textarea, .campo select { font: 400 19px var(--font-hand); border: 2px solid var(--ink); border-radius: 8px; padding: 4px 8px; background: #fff; }
.campo textarea { min-height: 70px; font: 400 17px var(--font-body); }
.pins { display: grid; gap: 6px; }
.pin { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: center; }
.pin b { width: 26px; height: 26px; border-radius: 50%; background: #9d174d; color: #fff; display: grid; place-items: center; font-size: 15px; }
.pin input { font: 400 19px var(--font-hand); border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; }
.pin button { border: 0; background: none; font-size: 20px; color: var(--ko); cursor: pointer; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; }
.palette span { width: 52px; height: 52px; border-radius: 10px; border: 2px solid var(--ink); cursor: pointer; position: relative; }
.aiuto { background: #fdf2f8; border: 2px solid #f9a8d4; border-radius: 12px; padding: 8px 12px; font-size: 16px; }
.scheda h2 { font: 700 36px var(--font-chalk); margin: 0; }
.scheda h3 { font: 400 24px var(--font-hand); margin: 10px 0 2px; color: #9d174d; }
.scheda p { margin: 2px 0; }
@media print { .app-bar, .tabs, .no-stampa, .passi, .quadro { display: none !important; } .layout { display: block; } }
</style>
</head>
<body>
<header class="app-bar"><h1>Detective dell'opera</h1><span class="sub">Leggere un'opera d'arte passo dopo passo</span></header>
<div class="container">
  <div class="passi no-stampa" id="passi"></div>
  <div class="layout">
    <div class="quadro"><canvas id="cv" width="900" height="650" aria-label="L'opera da analizzare"></canvas></div>
    <div class="card" id="pannello" style="display:grid;gap:12px"></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KEY = "detectiveOpera";
let S = { img: null, info: { titolo: "", autore: "", anno: "", tecnica: "" }, emozioni: [], perche: "", pins: [], focale: null, simm: "", linee: [], griglia: "", colori: [], tono: "", luce: "", direz: "", chiaro: "", messaggio: "", mioTitolo: "", passo: 0 };
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) S = Object.assign(S, v); } catch (e) {}
const salva = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { $("pannello").insertAdjacentHTML("afterbegin", '<p class="feedback ko">Immagine troppo grande per essere salvata: il lavoro resta finché non chiudi la pagina.</p>'); } };

/* Opera d'esempio: un paesaggio originale disegnato per l'app */
const ESEMPIO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650"><defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a6e"/><stop offset=".55" stop-color="#e98a4c"/><stop offset="1" stop-color="#f7d27a"/></linearGradient><radialGradient id="s"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#f5b041"/></radialGradient></defs>
<rect width="900" height="650" fill="url(#c)"/><circle cx="600" cy="300" r="70" fill="url(#s)"/>
<path d="M0 360 Q160 280 330 350 T640 330 T900 340 V650 H0Z" fill="#6b4c7a"/><path d="M0 430 Q200 370 420 430 T900 420 V650 H0Z" fill="#3f6b4f"/>
<path d="M0 520 Q300 470 520 520 T900 510 V650 H0Z" fill="#2f4f3a"/>
<path d="M430 650 Q470 560 520 520 Q560 500 600 470" stroke="#d9b98a" stroke-width="26" fill="none" stroke-linecap="round"/>
<rect x="215" y="400" width="18" height="120" fill="#3b2a20"/><ellipse cx="224" cy="380" rx="70" ry="80" fill="#24402e"/><ellipse cx="205" cy="360" rx="40" ry="46" fill="#2e5238"/>
<rect x="650" y="430" width="80" height="60" fill="#e7d3b0"/><path d="M640 432 L690 395 L740 432Z" fill="#a8432f"/><rect x="680" y="455" width="18" height="35" fill="#5a3a28"/><rect x="705" y="445" width="16" height="14" fill="#f7d27a"/>
<g fill="#1f1a2e"><path d="M300 150 q10 -8 20 0 q10 -8 20 0" stroke="#1f1a2e" stroke-width="4" fill="none"/><path d="M360 120 q8 -6 16 0 q8 -6 16 0" stroke="#1f1a2e" stroke-width="3" fill="none"/></g>
<g><circle cx="520" cy="560" r="11" fill="#2b2b2b"/><rect x="512" y="570" width="16" height="40" rx="6" fill="#8a2f3a"/><rect x="512" y="606" width="6" height="26" fill="#2b2b2b"/><rect x="522" y="606" width="6" height="26" fill="#2b2b2b"/></g></svg>`;
let immagine = null;
function caricaImmagine(src) { return new Promise(res => { const im = new Image(); im.onload = () => { immagine = im; res(); }; im.onerror = () => res(); im.src = src; }); }
function riduci(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1200 / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .82)); }; im.onerror = rej; im.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); });
}
/* ---- Disegno del quadro con segni ---- */
const cv = $("cv"), ctx = cv.getContext("2d");
function disegnaQuadro() {
  if (!immagine) { cv.width = 900; cv.height = 650; ctx.fillStyle = "#f6f1e6"; ctx.fillRect(0, 0, 900, 650); ctx.fillStyle = "#6b6258"; ctx.font = "34px 'Patrick Hand', cursive"; ctx.textAlign = "center"; ctx.fillText("Carica un'opera o usa l'esempio", 450, 330); return; }
  cv.width = immagine.naturalWidth || 900; cv.height = immagine.naturalHeight || 650;
  const W = cv.width, H = cv.height, u = Math.max(W, H) / 900;
  ctx.drawImage(immagine, 0, 0, W, H);
  ctx.lineWidth = 3 * u; ctx.setLineDash([12 * u, 8 * u]);
  if (S.griglia === "terzi") { ctx.strokeStyle = "rgba(255,255,255,.9)"; [1, 2].forEach(i => { line(W * i / 3, 0, W * i / 3, H); line(0, H * i / 3, W, H * i / 3); }); }
  if (S.griglia === "diagonali") { ctx.strokeStyle = "rgba(255,255,255,.9)"; line(0, 0, W, H); line(W, 0, 0, H); }
  if (S.griglia === "assi") { ctx.strokeStyle = "rgba(255,255,255,.9)"; line(W / 2, 0, W / 2, H); line(0, H / 2, W, H / 2); }
  ctx.setLineDash([]);
  S.pins.forEach((p, i) => { const x = p.x * W, y = p.y * H; ctx.fillStyle = "#9d174d"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3 * u; ctx.beginPath(); ctx.arc(x, y, 16 * u, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#fff"; ctx.font = `bold ${18 * u}px Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(i + 1, x, y + 1); });
  if (S.focale) { const x = S.focale.x * W, y = S.focale.y * H; ctx.font = `${44 * u}px Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("⭐", x, y); }
  function line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
}
function puntoDa(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
cv.addEventListener("click", e => {
  if (!immagine) return; const p = puntoDa(e), P = PASSI[S.passo].id;
  if (P === "vedo" && S.pins.length < 9) { S.pins.push({ x: p.x, y: p.y, t: "" }); salva(); disegnaQuadro(); pannello(); const ins = $("pannello").querySelectorAll(".pin input"); if (ins.length) ins[ins.length - 1].focus(); }
  else if (P === "composizione") { S.focale = p; salva(); disegnaQuadro(); }
  else if (P === "colore" && S.colori.length < 6) {
    disegnaPulito(); const d = ctx.getImageData(Math.floor(p.x * cv.width), Math.floor(p.y * cv.height), 1, 1).data; disegnaQuadro();
    S.colori.push("#" + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, "0")).join("")); salva(); pannello();
  }
});
function disegnaPulito() { ctx.drawImage(immagine, 0, 0, cv.width, cv.height); }

/* ---- Passi ---- */
const EMOZIONI = ["calma", "allegria", "tristezza", "paura", "mistero", "energia", "nostalgia", "stupore", "solitudine", "festa"];
const LINEE = [["orizzontali", "calma, stabilità"], ["verticali", "forza, slancio"], ["diagonali", "movimento, dinamismo"], ["curve", "morbidezza, armonia"]];
const PASSI = [
  { id: "opera", t: "1 · L'opera" }, { id: "impressione", t: "2 · Prima impressione" }, { id: "vedo", t: "3 · Cosa vedo" },
  { id: "composizione", t: "4 · Composizione" }, { id: "colore", t: "5 · Colore e luce" }, { id: "significato", t: "6 · Significato" }, { id: "scheda", t: "7 · La mia scheda" }
];
function chips(lista, scelti, max, attr) { return `<div class="chips" data-chips="${attr}">${lista.map(x => `<button type="button" data-v="${esc(x)}" aria-pressed="${scelti.includes(x)}">${esc(x)}</button>`).join("")}</div>`; }
function scelta(lista, val, attr) { return `<div class="chips" data-scelta="${attr}">${lista.map(x => `<button type="button" data-v="${esc(x)}" aria-pressed="${val === x}">${esc(x)}</button>`).join("")}</div>`; }
function pannello() {
  const P = PASSI[S.passo].id; let h = "";
  if (P === "opera") h = `<p class="consegna">Scegli l'opera da analizzare.</p>
    <div class="row"><button class="btn primary" id="b-carica">📷 Carica una foto o un file</button><button class="btn" id="b-esempio">🖼️ Usa l'opera d'esempio</button></div>
    <p class="aiuto">Puoi fotografare un'opera dal libro di arte, da un museo o caricare un'immagine. Rispetta i diritti: usa le immagini solo in classe.</p>
    <label class="campo">Titolo<input data-i="titolo" value="${esc(S.info.titolo)}"></label><label class="campo">Autore<input data-i="autore" value="${esc(S.info.autore)}"></label>
    <div class="row"><label class="campo" style="flex:1">Anno o secolo<input data-i="anno" value="${esc(S.info.anno)}"></label><label class="campo" style="flex:1">Tecnica<input data-i="tecnica" value="${esc(S.info.tecnica)}" placeholder="es. olio su tela"></label></div>
    <span class="nota">Se non li conosci, puoi cercarli dopo.</span>`;
  if (P === "impressione") h = `<p class="consegna">Guarda l'opera per 30 secondi in silenzio. Che cosa ti fa provare?</p>${chips(EMOZIONI, S.emozioni, 3, "emozioni")}<span class="nota">Scegline al massimo tre.</span>
    <label class="campo">Perché? Che cosa te lo fa pensare?<textarea data-c="perche">${esc(S.perche)}</textarea></label>`;
  if (P === "vedo") h = `<p class="consegna">Tocca l'opera per segnare quello che vedi (almeno 3 elementi).</p><p class="aiuto">Persone, animali, oggetti, paesaggio, edifici… Scrivi accanto a ogni numero che cosa hai segnato.</p>
    <div class="pins">${S.pins.map((p, i) => `<div class="pin"><b>${i + 1}</b><input data-pin="${i}" value="${esc(p.t)}" placeholder="Che cos'è?"><button data-xpin="${i}" aria-label="Togli">✕</button></div>`).join("") || '<span class="nota">Nessun segno ancora.</span>'}</div>`;
  if (P === "composizione") h = `<p class="consegna">Come è costruita l'immagine?</p>
    <div><b>Sovrapponi una griglia:</b>${scelta(["nessuna", "terzi", "diagonali", "assi"], S.griglia || "nessuna", "griglia")}</div>
    <div><b>L'opera è…</b>${scelta(["simmetrica", "asimmetrica"], S.simm, "simm")}</div>
    <div><b>Linee che prevalgono</b> (anche più di una)${chips(LINEE.map(l => l[0]), S.linee, 4, "linee")}<span class="nota">${LINEE.map(l => `${l[0]} → ${l[1]}`).join(" · ")}</span></div>
    <p class="aiuto">⭐ <b>Tocca l'opera</b> per mettere la stella sul <b>punto focale</b>: il punto che guardi per primo. Spesso è vicino agli incroci della griglia dei terzi.</p>`;
  if (P === "colore") h = `<p class="consegna">Contagocce: tocca l'opera per raccogliere i colori principali (fino a 6).</p>
    <div class="palette">${S.colori.map((c, i) => `<span style="background:${c}" data-xc="${i}" title="Tocca per togliere"></span>`).join("") || '<span class="nota" style="width:auto;height:auto;border:0">Nessun colore ancora.</span>'}</div>
    <div><b>Prevalgono i colori…</b>${scelta(["caldi", "freddi", "neutri", "misti"], S.tono, "tono")}</div>
    <div><b>La luce è…</b>${scelta(["naturale", "artificiale", "non si capisce"], S.luce, "luce")}</div>
    <div><b>Da dove arriva?</b>${scelta(["da sinistra", "da destra", "dall'alto", "di fronte", "da dietro (controluce)"], S.direz, "direz")}</div>
    <div><b>Luci e ombre sono…</b>${scelta(["forti e contrastate", "morbide e sfumate", "quasi assenti"], S.chiaro, "chiaro")}</div>`;
  if (P === "significato") h = `<p class="consegna">Che cosa vuole comunicare l'opera, secondo te?</p>
    <label class="campo">Il messaggio<textarea data-c="messaggio">${esc(S.messaggio)}</textarea></label>
    <label class="campo">Se fossi l'artista, che titolo le daresti?<input data-c="mioTitolo" value="${esc(S.mioTitolo)}"></label>
    <p class="aiuto">Collega quello che hai osservato: le emozioni (passo 2), i colori e la luce (passo 5), la composizione (passo 4).</p>`;
  if (P === "scheda") {
    h = `<div class="scheda" id="scheda"><h2>${esc(S.info.titolo || "Opera senza titolo")}</h2><p>${[S.info.autore, S.info.anno, S.info.tecnica].filter(Boolean).map(esc).join(" · ") || "<i>autore, anno e tecnica da cercare</i>"}</p>
      <h3>Prima impressione</h3><p>${S.emozioni.map(esc).join(", ") || "—"}${S.perche ? ": " + esc(S.perche) : ""}</p>
      <h3>Che cosa vedo</h3><p>${S.pins.map((p, i) => `${i + 1}. ${esc(p.t || "…")}`).join(" · ") || "—"}</p>
      <h3>Composizione</h3><p>${[S.simm && "opera " + S.simm, S.linee.length && "linee " + S.linee.join(", "), S.focale && "punto focale segnato con la stella"].filter(Boolean).join(" · ") || "—"}</p>
      <h3>Colore e luce</h3><div class="palette">${S.colori.map(c => `<span style="background:${c};width:34px;height:34px"></span>`).join("")}</div><p>${[S.tono && "colori " + S.tono, S.luce && "luce " + S.luce, S.direz, S.chiaro && "ombre " + S.chiaro].filter(Boolean).join(" · ") || "—"}</p>
      <h3>Significato</h3><p>${esc(S.messaggio) || "—"}</p>${S.mioTitolo ? `<p><b>Il mio titolo:</b> «${esc(S.mioTitolo)}»</p>` : ""}</div>
      <div class="row no-stampa"><button class="btn primary" id="b-png">🖼 Salva come immagine</button><button class="btn" id="b-stampa">🖨 Stampa</button><button class="btn" id="b-copia">📋 Copia il testo</button><button class="btn" id="b-nuova">✨ Nuova opera</button></div><p class="feedback no-stampa" id="s-fb"></p><img id="s-img" hidden style="max-width:100%;border:2px solid var(--ink)" alt="Scheda dell'opera">`;
  }
  h += `<div class="row no-stampa" style="justify-content:space-between">${S.passo ? '<button class="btn" id="b-prec">◀ Indietro</button>' : "<span></span>"}${S.passo < PASSI.length - 1 ? '<button class="btn primary" id="b-succ">Avanti ▶</button>' : ""}</div>`;
  $("pannello").innerHTML = h; colleghi(); disegnaPassi();
}
function colleghi() {
  const p = $("pannello");
  p.querySelectorAll("[data-i]").forEach(i => i.addEventListener("input", () => { S.info[i.dataset.i] = i.value; salva(); }));
  p.querySelectorAll("[data-c]").forEach(i => i.addEventListener("input", () => { S[i.dataset.c] = i.value; salva(); }));
  p.querySelectorAll("[data-chips]").forEach(box => box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const k = box.dataset.chips, a = S[k], v = b.dataset.v, j = a.indexOf(v);
    if (j >= 0) a.splice(j, 1); else if (k !== "emozioni" || a.length < 3) a.push(v); salva(); pannello();
  })));
  p.querySelectorAll("[data-scelta]").forEach(box => box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { S[box.dataset.scelta] = b.dataset.v; salva(); disegnaQuadro(); pannello(); })));
  p.querySelectorAll("[data-pin]").forEach(i => i.addEventListener("input", () => { S.pins[+i.dataset.pin].t = i.value; salva(); }));
  p.querySelectorAll("[data-xpin]").forEach(b => b.addEventListener("click", () => { S.pins.splice(+b.dataset.xpin, 1); salva(); disegnaQuadro(); pannello(); }));
  p.querySelectorAll("[data-xc]").forEach(b => b.addEventListener("click", () => { S.colori.splice(+b.dataset.xc, 1); salva(); pannello(); }));
  const on = (id, f) => { const e = $(id); if (e) e.addEventListener("click", f); };
  on("b-prec", () => { S.passo--; salva(); pannello(); });
  on("b-succ", () => { if (S.passo === 0 && !immagine) { alertMsg("Prima scegli un'opera."); return; } S.passo++; salva(); pannello(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  on("b-carica", () => $("file").click());
  on("b-esempio", async () => { S.img = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(ESEMPIO); S.info = { titolo: "Tramonto sulla collina (esempio)", autore: "Prof Tech Lab", anno: "2026", tecnica: "illustrazione digitale" }; await caricaImmagine(S.img); salva(); disegnaQuadro(); pannello(); });
  on("b-stampa", () => window.print());
  on("b-copia", async () => { try { await navigator.clipboard.writeText($("scheda").innerText); $("s-fb").className = "feedback ok"; $("s-fb").textContent = "✔ Testo copiato."; } catch (e) { $("s-fb").textContent = "Copia non disponibile qui."; } });
  on("b-nuova", () => { const tmp = S.passo; S = { img: null, info: { titolo: "", autore: "", anno: "", tecnica: "" }, emozioni: [], perche: "", pins: [], focale: null, simm: "", linee: [], griglia: "", colori: [], tono: "", luce: "", direz: "", chiaro: "", messaggio: "", mioTitolo: "", passo: 0 }; immagine = null; salva(); disegnaQuadro(); pannello(); });
  on("b-png", salvaPng);
}
function alertMsg(t) { const p = $("pannello"); const f = document.createElement("p"); f.className = "feedback ko"; f.textContent = t; p.prepend(f); }
function disegnaPassi() { $("passi").innerHTML = PASSI.map((x, i) => `<button data-p="${i}" ${i === S.passo ? 'aria-current="step"' : ""}>${x.t}</button>`).join(""); $("passi").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { if (!immagine && +b.dataset.p > 0) return; S.passo = +b.dataset.p; salva(); pannello(); })); }
$("file").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return; try { S.img = await riduci(f); S.pins = []; S.focale = null; S.colori = []; await caricaImmagine(S.img); salva(); disegnaQuadro(); pannello(); } catch (err) { alertMsg("Non riesco ad aprire questa immagine."); } });

/* ---- Scheda come immagine ---- */
async function salvaPng() {
  const sch = $("scheda"), W = 1200, M = 50, testo = sch.innerText.split("\n").map(t => t.trim()).filter(Boolean);
  const TIT = /^(Prima impressione|Che cosa vedo|Composizione|Colore e luce|Significato)$/;
  const k = immagine ? Math.min(560 / immagine.naturalHeight, 1100 / immagine.naturalWidth) : 0, ih = immagine ? immagine.naturalHeight * k : 0;
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const stile = (t, i) => i === 0 ? ["bold 38px Arial", "#1f2a44", 46] : TIT.test(t) ? ["bold 26px Arial", "#9d174d", 40] : ["22px Arial", "#1f2a44", 30];
  const righe = (t, f) => { x.font = f; const out = []; let r = ""; t.split(" ").forEach(p => { const pr = r ? r + " " + p : p; if (x.measureText(pr).width > W - 2 * M && r) { out.push(r); r = p; } else r = pr; }); out.push(r); return out; };
  let alt = 40 + ih + 50; testo.forEach((t, i) => { const [f, , lh] = stile(t, i); alt += righe(t, f).length * lh; });
  const pal = S.colori.length ? 60 : 0; c.width = W; c.height = alt + pal + 40;
  x.fillStyle = "#fffdf6"; x.fillRect(0, 0, W, c.height);
  if (immagine) { disegnaQuadro(); x.drawImage(cv, (W - immagine.naturalWidth * k) / 2, 40, immagine.naturalWidth * k, ih); }
  let y = 40 + ih + 50;
  testo.forEach((t, i) => { const [f, col, lh] = stile(t, i); x.fillStyle = col; righe(t, f).forEach(r => { x.font = f; x.fillText(r, M, y); y += lh; });
    if (t === "Colore e luce" && S.colori.length) { S.colori.forEach((cc, j) => { x.fillStyle = cc; x.fillRect(M + j * 56, y - 18, 46, 46); x.strokeStyle = "#1f2a44"; x.strokeRect(M + j * 56, y - 18, 46, 46); }); y += 60; } });
  const blob = await new Promise(r => c.toBlob(r, "image/png")), nome = "scheda-opera.png";
  let r = null; try { if (window.parent !== window && typeof window.parent.ptlSalva === "function") r = await window.parent.ptlSalva(nome, blob); } catch (e) {}
  if (r === "saved") { $("s-fb").className = "feedback ok"; $("s-fb").textContent = "✔ Immagine salvata."; return; }
  $("s-img").src = c.toDataURL("image/png"); $("s-img").hidden = false; $("s-fb").className = "feedback"; $("s-fb").textContent = "Tieni premuta l'immagine qui sotto e scegli «Salva immagine».";
}

(async () => { if (S.img) await caricaImmagine(S.img); disegnaQuadro(); pannello(); })();
