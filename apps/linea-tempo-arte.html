<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La linea del tempo dell'arte</title>
<link rel="stylesheet" href="ptl.css">
<style>
:root { --accent: #0e7490; }
.linea { position: relative; display: grid; gap: 14px; padding-left: 34px; }
.linea::before { content: ""; position: absolute; left: 13px; top: 6px; bottom: 6px; width: 6px; border-radius: 3px; background: linear-gradient(#a16207, #7c3aed, #0e7490, #dc2626); }
.periodo { position: relative; background: var(--label); border: 2px solid var(--ink); border-left: 10px solid var(--c); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; display: grid; gap: 4px; }
.periodo::before { content: ""; position: absolute; left: -34px; top: 16px; width: 20px; height: 20px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); }
.periodo h3 { margin: 0; font: 400 28px/1.1 var(--font-hand); }
.periodo .quando { font: 700 16px var(--font-body); color: var(--c); }
.periodo .dett { display: none; gap: 6px; }
.periodo.aperto .dett { display: grid; }
.periodo ul { margin: 0; padding-left: 1.2em; }
.periodo .es { font-size: 16px; color: var(--muted); }
.periodo .testa { display: flex; gap: 12px; align-items: center; }
.funzione { background: #fff; border: 2px dashed var(--c); border-radius: 10px; padding: 6px 10px; }
.opere { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.opere > div { background: #fff; border: 1.5px solid #d6d3d1; border-radius: 10px; padding: 6px 8px; font-size: 16px; }
.opere .cat { font: 700 15px var(--font-body); color: var(--c); }
.opere li.es { font-style: italic; }
.carte { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.carta { position: relative; background: var(--label); border: 3px solid var(--ink); border-top: 12px solid var(--c); border-radius: 12px; padding: 12px; font: 400 23px var(--font-hand); cursor: pointer; text-align: center; min-height: 90px; }
.carta .num { position: absolute; top: -26px; right: -10px; width: 40px; height: 40px; border-radius: 50%; background: var(--giallo); border: 2px solid var(--ink); display: grid; place-items: center; font: 700 20px var(--font-body); }
.carta.giusta { background: #d7f2e1; } .carta.sbagliata { background: #fbe0e0; }
.carta small { display: block; font: 600 14px var(--font-body); color: var(--muted); }
.domanda { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.domanda .testo { font: 400 28px/1.2 var(--font-hand); }
.opzioni { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opzioni button { font: 400 22px var(--font-hand); border: 3px solid var(--ink); border-radius: 12px; background: var(--label); padding: 8px; cursor: pointer; }
.opzioni button.giusta { background: #c9f0d8; border-color: var(--ok); } .opzioni button.sbagliata { background: #f8d0d0; border-color: var(--ko); }
</style>
</head>
<body>
<header class="app-bar"><h1>La linea del tempo dell'arte</h1><span class="sub">Dalla preistoria a oggi</span></header>
<div class="container">
  <div class="tabs" role="tablist">
    <button class="tab" id="t-esplora" aria-selected="true">🗺️ Esplora</button>
    <button class="tab" id="t-ordina" aria-selected="false">🔢 Metti in ordine</button>
    <button class="tab" id="t-stile" aria-selected="false">🕵️ Che stile è?</button>
  </div>
  <section id="s-esplora" style="display:grid;gap:12px"><p class="consegna">Tocca un periodo per scoprire le sue caratteristiche e le opere più famose.</p><div class="linea" id="linea"></div></section>
  <section id="s-ordina" hidden style="display:grid;gap:12px">
    <p class="consegna">Tocca i periodi <b>dal più antico al più recente</b>. Tocca di nuovo un periodo per togliere il numero.</p>
    <div class="carte" id="ord-carte" style="margin-top:14px"></div>
    <div class="row"><button class="btn primary" id="ord-ok">Controlla</button><button class="btn" id="ord-nuovo">🔀 Altri periodi</button><span class="nota" id="ord-punti"></span></div>
    <p class="feedback" id="ord-fb"></p>
  </section>
  <section id="s-stile" hidden style="display:grid;gap:12px">
    <div class="row" style="justify-content:space-between"><span class="nota" id="st-n"></span><span class="nota" id="st-punti"></span></div>
    <div class="domanda"><span class="nota" id="st-tipo"></span><div class="testo" id="st-testo"></div><div class="opzioni" id="st-opz"></div><p class="feedback" id="st-fb"></p><button class="btn primary" id="st-avanti" hidden style="justify-self:start">Avanti ➜</button></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mescola = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const P = [
  { n: "Arte preistorica", q: "circa 40.000 – 3000 a.C.", c: "#a16207", ic: "mano", fun: "Magica e propiziatoria: dipingere gli animali serviva forse a propiziare la caccia e a compiere riti.", car: ["Pitture nelle grotte con animali e scene di caccia", "Colori naturali: terre, carbone, ocra", "Statuette femminili (le «Veneri») e grandi monumenti di pietra"],
    arch: ["Stonehenge, Inghilterra (dal 3000 a.C. circa)", "Dolmen e menhir"], scul: ["Venere di Willendorf, Austria"], pitt: ["Grotte di Lascaux, Francia (circa 17.000 anni fa)", "Grotta di Altamira, Spagna"] },
  { n: "Arte egizia", q: "circa 3100 – 30 a.C.", c: "#ca8a04", ic: "piramide", fun: "Religiosa e funeraria: garantire al faraone e ai defunti la vita dopo la morte, e celebrare il potere del faraone.", car: ["Figure con testa e gambe di profilo, busto e occhio di fronte", "Le persone importanti sono disegnate più grandi", "Arte legata alla vita dopo la morte: tombe e piramidi"],
    arch: ["Piramidi di Giza (circa 2600–2500 a.C.)", "Tempio di Karnak, Luxor"], scul: ["Grande Sfinge di Giza", "Busto di Nefertiti (circa 1345 a.C.)", "Maschera d'oro di Tutankhamon"], pitt: ["Pitture della tomba di Nebamon (circa 1350 a.C.)"] },
  { n: "Arte greca", q: "circa 800 – 31 a.C.", c: "#2563eb", ic: "tempio", fun: "Celebrare gli dei e la bellezza ideale del corpo umano; abbellire la città (la polis) e i suoi santuari.", car: ["Ricerca della bellezza ideale e delle proporzioni perfette", "Templi con gli ordini dorico, ionico e corinzio", "Statue che sembrano muoversi e respirare"],
    arch: ["Partenone, Atene (447–432 a.C.)"], scul: ["Doriforo di Policleto (circa 450 a.C., noto da copie romane)", "Discobolo di Mirone (circa 450 a.C., noto da copie romane)", "Bronzi di Riace (V secolo a.C.)"], pitt: ["Vasi dipinti a figure nere e a figure rosse"] },
  { n: "Arte romana", q: "circa II sec. a.C. – V sec. d.C.", c: "#b91c1c", ic: "arco", fun: "Celebrativa e pratica: esaltare Roma e l'imperatore (propaganda) e costruire opere utili a tutti.", car: ["Grandi opere pubbliche: strade, acquedotti, anfiteatri", "Uso dell'arco, della volta, della cupola e del calcestruzzo", "Ritratti realistici, mosaici e affreschi"],
    arch: ["Colosseo, Roma (inaugurato nell'80 d.C.)", "Pantheon, Roma (II secolo d.C.)"], scul: ["Colonna Traiana (113 d.C.)", "Ara Pacis, Roma (9 a.C.)"], pitt: ["Affreschi di Pompei", "Mosaici delle case romane"] },
  { n: "Arte paleocristiana e bizantina", q: "IV – XV secolo", c: "#d4a017", ic: "mosaico", fun: "Religiosa e simbolica: far sentire la presenza di Dio con la luce e l'oro, e mostrare la potenza dell'imperatore.", car: ["Mosaici scintillanti con il fondo d'oro", "Figure frontali, solenni, poco realistiche", "Luce e materiali preziosi per rappresentare il sacro"],
    arch: ["Santa Sofia, Costantinopoli (537)", "Basilica di San Vitale, Ravenna (consacrata nel 547)"], scul: ["Sarcofagi paleocristiani con storie della Bibbia"], pitt: ["Mosaici di San Vitale, Ravenna (VI secolo)", "Mosaici del Mausoleo di Galla Placidia, Ravenna (V secolo)", "Icone su tavola"] },
  { n: "Arte romanica", q: "XI – XII secolo", c: "#78716c", ic: "romanica", fun: "Didattica: le sculture e le pitture raccontavano la Bibbia a chi non sapeva leggere (la «Bibbia dei poveri»).", car: ["Chiese con muri spessi e poche finestre", "Archi a tutto sesto (a semicerchio)", "Sculture sulle facciate che raccontano storie della Bibbia"],
    arch: ["Duomo di Modena (dal 1099)", "Basilica di Sant'Ambrogio, Milano", "Piazza dei Miracoli, Pisa"], scul: ["Wiligelmo, Storie della Genesi sulla facciata del Duomo di Modena", "Benedetto Antelami, Deposizione, Duomo di Parma (1178)"], pitt: ["Croci dipinte su tavola e affreschi nelle chiese"] },
  { n: "Arte gotica", q: "XII – XIV secolo", c: "#4338ca", ic: "gotica", fun: "Religiosa e didattica: avvicinare a Dio con la luce delle vetrate; mostrare la ricchezza e l'orgoglio delle città.", car: ["Archi a sesto acuto: le chiese si slanciano verso l'alto", "Grandi vetrate colorate che riempiono di luce", "In pittura figure più umane ed espressive (Giotto)"],
    arch: ["Cattedrale di Notre-Dame, Parigi (dal 1163)", "Duomo di Milano (dal 1386)"], scul: ["Nicola Pisano, Pulpito del Battistero di Pisa (1260)"], pitt: ["Giotto, Cappella degli Scrovegni, Padova (1303–1305)", "Duccio di Buoninsegna, Maestà (1308–1311)"] },
  { n: "Rinascimento", q: "XV – XVI secolo", c: "#059669", ic: "cupola", fun: "Celebrativa e conoscitiva: glorificare i signori e i mecenati, e studiare il mondo con la scienza (prospettiva, anatomia).", car: ["Prospettiva geometrica: lo spazio sembra vero", "Ritorno ai modelli greci e romani", "L'uomo al centro: anatomia e proporzioni studiate dal vero"],
    arch: ["Brunelleschi, Cupola di Santa Maria del Fiore (1420–1436)"], scul: ["Donatello, David in bronzo (circa 1440)", "Michelangelo, David (1501–1504)"], pitt: ["Masaccio, Trinità (1425–1427)", "Botticelli, Nascita di Venere (circa 1485)", "Leonardo, La Gioconda (inizio XVI secolo)", "Raffaello, La Scuola di Atene (1509–1511)"] },
  { n: "Barocco", q: "XVII secolo", c: "#7e22ce", ic: "voluta", fun: "Persuasiva: stupire e commuovere i fedeli (Controriforma) e mostrare la grandezza della Chiesa e dei sovrani.", car: ["Movimento, teatralità e meraviglia", "Forti contrasti di luce e ombra", "Linee curve e decorazioni ricchissime"],
    arch: ["Bernini, Colonnato di San Pietro (1656–1667)", "Borromini, San Carlo alle Quattro Fontane, Roma (1638–1641)"], scul: ["Bernini, Apollo e Dafne (1622–1625)"], pitt: ["Caravaggio, Vocazione di San Matteo (1599–1600)"] },
  { n: "Neoclassicismo", q: "circa 1750 – 1830", c: "#94a3b8", ic: "colonna", fun: "Educativa e morale: proporre modelli di virtù, ordine ed equilibrio presi dall'antichità.", car: ["Ritorno all'arte greca e romana", "Equilibrio, calma, linee pulite", "Colori sobri e forme perfette"],
    arch: ["Giuseppe Piermarini, Teatro alla Scala, Milano (1778)"], scul: ["Antonio Canova, Amore e Psiche (1787–1793)"], pitt: ["Jacques-Louis David, Il giuramento degli Orazi (1784)"] },
  { n: "Romanticismo", q: "circa 1800 – 1850", c: "#be185d", ic: "montagna", fun: "Espressiva e patriottica: esprimere i sentimenti dell'artista e gli ideali di libertà e di patria.", car: ["Le emozioni e i sentimenti al centro", "Natura grandiosa e potente", "Storia, patria e libertà"],
    arch: ["Palazzo di Westminster, Londra, in stile neogotico (dal 1840)"], scul: ["François Rude, La Marsigliese, Arco di Trionfo, Parigi (1833–1836)"], pitt: ["Caspar David Friedrich, Viandante sul mare di nebbia (circa 1818)", "Eugène Delacroix, La Libertà che guida il popolo (1830)", "Francesco Hayez, Il bacio (1859)"] },
  { n: "Impressionismo", q: "circa 1860 – 1890", c: "#0ea5e9", ic: "sole", fun: "Catturare l'attimo: rappresentare la luce e la vita moderna così come l'occhio le percepisce.", car: ["Si dipinge all'aria aperta (en plein air)", "La luce e i suoi cambiamenti sono la vera protagonista", "Pennellate rapide e visibili, colori chiari"],
    arch: ["Negli stessi anni: architettura del ferro e del vetro (Torre Eiffel, 1889)"], scul: ["Edgar Degas, Piccola danzatrice di quattordici anni (1881)"], pitt: ["Claude Monet, Impressione, levar del sole (1872)", "Pierre-Auguste Renoir, Ballo al Moulin de la Galette (1876)", "Edgar Degas, le ballerine"] },
  { n: "Postimpressionismo", q: "circa 1885 – 1905", c: "#f59e0b", ic: "spirale", fun: "Espressiva e personale: il quadro mostra il modo unico in cui l'artista sente e costruisce il mondo.", car: ["Colori forti ed espressivi", "Forme semplificate e solide", "Nuove tecniche, come il puntinismo"],
    arch: ["Negli stessi anni: Art Nouveau (Gaudí, Sagrada Família, dal 1882)"], scul: ["Negli stessi anni: Auguste Rodin, Il pensatore"], pitt: ["Vincent van Gogh, Notte stellata (1889)", "Georges Seurat, Una domenica pomeriggio all'isola della Grande Jatte (1884–1886)", "Paul Cézanne, la montagna Sainte-Victoire"] },
  { n: "Avanguardie del Novecento", q: "circa 1905 – 1945", c: "#dc2626", ic: "forme", fun: "Sperimentale e provocatoria: rompere con la tradizione e inventare nuovi modi di vedere.", car: ["Rottura con la tradizione e con la pittura «come una foto»", "Cubismo: un oggetto visto da più punti di vista insieme; Futurismo: velocità e movimento", "Astrattismo: niente soggetti riconoscibili; Surrealismo: il mondo dei sogni"],
    arch: ["Walter Gropius, Bauhaus, Dessau (1925–1926)", "Le Corbusier, Villa Savoye (1928–1931)"], scul: ["Umberto Boccioni, Forme uniche della continuità nello spazio (1913)"], pitt: ["Pablo Picasso, Les Demoiselles d'Avignon (1907)", "Vasilij Kandinskij, i primi quadri astratti (circa 1910)", "Salvador Dalí, La persistenza della memoria (1931)"] },
  { n: "Arte contemporanea", q: "dal 1945 a oggi", c: "#16a34a", ic: "pop", fun: "Critica e comunicativa: far riflettere sulla società, sui consumi e sull'ambiente; spesso il pubblico partecipa all'opera.", car: ["Pop Art: oggetti di tutti i giorni, pubblicità e fumetti", "Nuovi materiali e tecnologie: installazioni, video, performance", "L'idea conta quanto l'opera; arte anche nelle strade"],
    arch: ["Renzo Piano e Richard Rogers, Centre Pompidou, Parigi (1977)", "Frank Gehry, Museo Guggenheim, Bilbao (1997)"], scul: ["Michelangelo Pistoletto, Venere degli stracci (1967)", "Installazioni e street art"], pitt: ["Andy Warhol, Marilyn (1962)", "Roy Lichtenstein, quadri come vignette di fumetti"] }
];
P.forEach(p => p.es = [...p.arch, ...p.scul, ...p.pitt].filter(e => !e.startsWith("Negli stessi anni")));
/* Simboli disegnati per ogni periodo (originali, 48×48) */
const ICONE = {
  mano: c => `<rect width="48" height="48" rx="10" fill="#3b2a1e"/><path d="M17 40 L14 24 Q13 20 16 20 L18 27 L17 10 Q18 7 20 10 L22 25 L23 7 Q25 5 26 8 L26 25 L29 9 Q31 7 32 10 L30 27 L34 17 Q37 16 36 20 L32 34 Q29 41 22 41Z" fill="${c}"/>`,
  piramide: c => `<rect width="48" height="48" rx="10" fill="#fde68a"/><circle cx="36" cy="12" r="6" fill="#f59e0b"/><path d="M6 40 L22 12 L38 40Z" fill="${c}"/><path d="M22 12 L38 40 L30 40Z" fill="#00000033"/>`,
  tempio: c => `<rect width="48" height="48" rx="10" fill="#dbeafe"/><path d="M6 16 L24 7 L42 16Z" fill="${c}"/><rect x="7" y="16" width="34" height="3" fill="${c}"/>${[9, 17, 25, 33].map(x => `<rect x="${x}" y="20" width="5" height="16" fill="${c}"/>`).join("")}<rect x="5" y="37" width="38" height="4" fill="${c}"/>`,
  arco: c => `<rect width="48" height="48" rx="10" fill="#fee2e2"/><path d="M6 42 V14 H42 V42 H33 V28 A9 9 0 0 0 15 28 V42Z" fill="${c}"/><rect x="5" y="10" width="38" height="4" fill="${c}"/>`,
  mosaico: c => `<rect width="48" height="48" rx="10" fill="#1e3a8a"/>${Array.from({ length: 25 }, (_, i) => `<rect x="${5 + (i % 5) * 8}" y="${5 + Math.floor(i / 5) * 8}" width="6.5" height="6.5" fill="${[6, 8, 11, 12, 13, 16, 18].includes(i) ? "#fff7d6" : c}"/>`).join("")}`,
  romanica: c => `<rect width="48" height="48" rx="10" fill="#e7e5e4"/><path d="M8 42 V18 L24 8 L40 18 V42Z" fill="${c}"/><path d="M18 42 V30 A6 6 0 0 1 30 30 V42Z" fill="#292524"/><circle cx="24" cy="20" r="3" fill="#292524"/>`,
  gotica: c => `<rect width="48" height="48" rx="10" fill="#e0e7ff"/><path d="M12 44 V22 Q12 8 24 4 Q36 8 36 22 V44Z" fill="${c}"/><path d="M16 42 V24 Q16 13 24 9 Q32 13 32 24 V42Z" fill="#f43f5e"/><path d="M24 9 V42 M16 26 H32 M16 34 H32" stroke="#fde047" stroke-width="2.4"/>`,
  cupola: c => `<rect width="48" height="48" rx="10" fill="#d1fae5"/><path d="M8 38 Q8 14 24 10 Q40 14 40 38Z" fill="${c}"/><path d="M24 10 V38 M16 14 Q14 26 15 38 M32 14 Q34 26 33 38" stroke="#fff" stroke-width="2"/><rect x="21" y="4" width="6" height="7" fill="${c}"/><rect x="6" y="38" width="36" height="5" fill="#475569"/>`,
  voluta: c => `<rect width="48" height="48" rx="10" fill="#f3e8ff"/><path d="M8 40 Q8 8 30 8 Q42 8 40 20 Q38 30 28 26 Q22 22 28 18" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/><path d="M40 40 Q22 40 22 30" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`,
  colonna: c => `<rect width="48" height="48" rx="10" fill="#f1f5f9"/><rect x="14" y="8" width="20" height="5" fill="${c}"/><rect x="18" y="13" width="12" height="24" fill="${c}"/><path d="M21 14 V36 M24 14 V36 M27 14 V36" stroke="#fff" stroke-width="1.4"/><rect x="13" y="37" width="22" height="5" fill="${c}"/>`,
  montagna: c => `<rect width="48" height="48" rx="10" fill="#fce7f3"/><circle cx="35" cy="12" r="5" fill="#fff"/><path d="M2 40 L16 18 L24 28 L32 14 L46 40Z" fill="${c}"/><path d="M2 34 Q14 30 24 34 T46 33 V40 H2Z" fill="#ffffffaa"/>`,
  sole: c => `<rect width="48" height="48" rx="10" fill="#bae6fd"/><circle cx="24" cy="20" r="8" fill="#f97316"/>${[28, 33, 38, 43].map((y, i) => `<path d="M${8 + i * 2} ${y} H${18 + i} M${22} ${y} H${30 - i} M${33} ${y} H${40 - i * 2}" stroke="${i % 2 ? "#f97316" : c}" stroke-width="2.5" stroke-linecap="round"/>`).join("")}`,
  spirale: c => `<rect width="48" height="48" rx="10" fill="#1e3a8a"/><path d="M24 24 Q24 18 30 20 Q36 24 30 31 Q22 36 16 28 Q12 18 22 12 Q34 8 40 18" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="#fde047"/><circle cx="38" cy="38" r="2.5" fill="#fde047"/>`,
  forme: c => `<rect width="48" height="48" rx="10" fill="#fef2f2"/><rect x="6" y="18" width="18" height="22" fill="${c}" transform="rotate(-10 15 29)"/><path d="M20 8 L40 14 L28 32Z" fill="#1d4ed8" opacity=".85"/><circle cx="33" cy="34" r="9" fill="#facc15" opacity=".9"/>`,
  pop: c => `<rect width="48" height="48" rx="10" fill="#fef9c3"/>${Array.from({ length: 16 }, (_, i) => `<circle cx="${8 + (i % 4) * 11}" cy="${8 + Math.floor(i / 4) * 11}" r="3" fill="#ef444499"/>`).join("")}<path d="M10 14 H38 Q42 14 42 18 V28 Q42 32 38 32 H22 L14 40 L16 32 H10 Q6 32 6 28 V18 Q6 14 10 14Z" fill="#fff" stroke="${c}" stroke-width="3"/><text x="24" y="28" text-anchor="middle" font-family="Arial" font-weight="900" font-size="11" fill="${c}">POP!</text>`
};
const icona = (p, sz = 44) => `<svg viewBox="0 0 48 48" width="${sz}" height="${sz}" aria-hidden="true" style="flex:none">${ICONE[p.ic](p.c)}</svg>`;
const lista = a => a.length ? `<ul>${a.map(e => `<li${e.startsWith("Negli stessi anni") ? ' class="es"' : ""}>${esc(e)}</li>`).join("")}</ul>` : "<span class=\"es\">—</span>";
/* ---- Esplora ---- */
$("linea").innerHTML = P.map((p, i) => `<button class="periodo" style="--c:${p.c}" data-i="${i}" aria-expanded="false"><div class="testa">${icona(p)}<div><span class="quando">${esc(p.q)}</span><h3>${esc(p.n)}</h3></div></div><div class="dett"><ul>${p.car.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
  <div class="funzione"><b>🎯 A che cosa serviva l'arte?</b> ${esc(p.fun)}</div>
  <b>Opere da conoscere</b><div class="opere"><div><span class="cat">🏛️ Architettura</span>${lista(p.arch)}</div><div><span class="cat">🗿 Scultura</span>${lista(p.scul)}</div><div><span class="cat">🎨 Pittura</span>${lista(p.pitt)}</div></div></div></button>`).join("");
$("linea").querySelectorAll(".periodo").forEach(b => b.addEventListener("click", () => { const a = b.classList.toggle("aperto"); b.setAttribute("aria-expanded", a); }));
/* ---- Metti in ordine ---- */
let ord = null, ordOk = 0, ordTot = 0;
function nuovoOrdine() {
  const scelti = mescola(P.map((_, i) => i)).slice(0, 6);
  ord = { carte: mescola(scelti), scelta: [], fatto: false }; disegnaOrdine(); $("ord-fb").textContent = "";
}
function disegnaOrdine() {
  const giusto = ord.carte.slice().sort((a, b) => a - b);
  $("ord-carte").innerHTML = ord.carte.map(i => { const k = ord.scelta.indexOf(i), stato = ord.fatto ? (giusto.indexOf(i) === k ? " giusta" : " sbagliata") : "";
    return `<button class="carta${stato}" style="--c:${P[i].c}" data-i="${i}">${k >= 0 ? `<span class="num">${k + 1}</span>` : ""}${icona(P[i], 40)}<br>${esc(P[i].n)}${ord.fatto ? `<small>${esc(P[i].q)}</small>` : ""}</button>`; }).join("");
  $("ord-carte").querySelectorAll(".carta").forEach(b => b.addEventListener("click", () => { if (ord.fatto) return; const i = +b.dataset.i, k = ord.scelta.indexOf(i); if (k >= 0) ord.scelta.splice(k, 1); else ord.scelta.push(i); disegnaOrdine(); }));
}
$("ord-ok").addEventListener("click", () => {
  if (ord.fatto) return;
  if (ord.scelta.length < ord.carte.length) { $("ord-fb").className = "feedback ko"; $("ord-fb").textContent = "Numera tutti i periodi prima di controllare."; return; }
  ord.fatto = true; ordTot++;
  const giusto = ord.carte.slice().sort((a, b) => a - b), ok = ord.scelta.every((x, k) => x === giusto[k]); if (ok) ordOk++;
  $("ord-fb").className = "feedback " + (ok ? "ok" : "ko"); $("ord-fb").textContent = ok ? "✔ Ordine perfetto!" : "Qualcosa è fuori posto: le carte rosse. Sotto ogni nome ora vedi il periodo.";
  $("ord-punti").textContent = `Sequenze giuste: ${ordOk} su ${ordTot}`; disegnaOrdine();
});
$("ord-nuovo").addEventListener("click", nuovoOrdine);
/* ---- Che stile è? ---- */
let st = null;
function nuovaSerie() {
  const dom = [];
  P.forEach((p, i) => { p.es.forEach(e => dom.push({ i, tipo: "Di quale periodo è quest'opera?", t: e })); p.car.forEach(c => dom.push({ i, tipo: "Di quale periodo è questa caratteristica?", t: c })); dom.push({ i, tipo: "In quale periodo l'arte aveva questa funzione?", t: p.fun }); });
  st = { dom: mescola(dom).slice(0, 10), k: 0, ok: 0 }; domanda();
}
function domanda() {
  if (st.k >= st.dom.length) { $("st-tipo").textContent = ""; $("st-testo").innerHTML = `Hai risposto bene a <b>${st.ok} domande su ${st.dom.length}</b>!`; $("st-opz").innerHTML = ""; $("st-fb").textContent = ""; $("st-avanti").hidden = false; $("st-avanti").textContent = "↺ Nuova serie"; return; }
  const d = st.dom[st.k], vicini = mescola([d.i - 2, d.i - 1, d.i + 1, d.i + 2, d.i + 3, d.i - 3].filter(x => x >= 0 && x < P.length)).slice(0, 3), ops = mescola([d.i, ...vicini]);
  $("st-n").textContent = `Domanda ${st.k + 1} di ${st.dom.length}`; $("st-punti").textContent = `Giuste: ${st.ok}`;
  $("st-tipo").textContent = d.tipo; $("st-testo").textContent = d.t.replace(/^(Leonardo|Michelangelo|Raffaello|Brunelleschi|Botticelli|Giotto|Caravaggio|Bernini), /, m => m);
  $("st-fb").textContent = ""; $("st-avanti").hidden = true; $("st-avanti").textContent = "Avanti ➜";
  $("st-opz").innerHTML = ops.map(i => `<button data-i="${i}">${esc(P[i].n)}</button>`).join("");
  $("st-opz").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    $("st-opz").querySelectorAll("button").forEach(x => { x.disabled = true; if (+x.dataset.i === d.i) x.classList.add("giusta"); });
    const ok = +b.dataset.i === d.i; if (ok) st.ok++; else b.classList.add("sbagliata");
    $("st-fb").className = "feedback " + (ok ? "ok" : "ko"); $("st-fb").textContent = (ok ? "✔ Giusto! " : "✘ ") + `${P[d.i].n}: ${P[d.i].q}.`;
    $("st-punti").textContent = `Giuste: ${st.ok}`; $("st-avanti").hidden = false;
  }));
}
$("st-avanti").addEventListener("click", () => { if (st.k >= st.dom.length) nuovaSerie(); else { st.k++; domanda(); } });
/* ---- Schede ---- */
const TAB = ["esplora", "ordina", "stile"];
TAB.forEach(t => $("t-" + t).addEventListener("click", () => { TAB.forEach(x => { $("t-" + x).setAttribute("aria-selected", x === t); $("s-" + x).hidden = x !== t; }); if (t === "ordina" && !ord) nuovoOrdine(); if (t === "stile" && !st) nuovaSerie(); }));
</script>
<script src="a11y.js"></script>
</body>
</html>
